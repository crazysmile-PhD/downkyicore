name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '24 18 * * 2'

permissions:
  actions: read
  contents: read
  security-events: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  CODEQL_OVERLAY_DATABASE_MODE: 'none'

jobs:
  analyze:
    name: Analyze C#
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Restore
        run: dotnet restore ./DownKyi.sln
      - name: Build
        run: dotnet build ./DownKyi.sln -c Release --no-restore --no-incremental
      - name: Analyze
        uses: github/codeql-action/analyze@v4
