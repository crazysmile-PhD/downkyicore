name: Process Membership Feasibility

on:
  pull_request:
    paths:
      - .github/workflows/process-membership-feasibility.yml
      - script/process-supervision-feasibility/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cgroup-v2:
    name: Linux delegated cgroup v2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Record runner cgroup context
        shell: bash
        run: |
          id
          stat -fc 'filesystem=%T' /sys/fs/cgroup
          cat /proc/self/cgroup
          current_path="$(awk -F '::' '$1 == "0" { print $2 }' /proc/self/cgroup)"
          if [ -z "$current_path" ]; then
            echo '::error::No unified cgroup v2 path is available.'
            exit 1
          fi
          ls -ld "/sys/fs/cgroup${current_path}"
      - name: Prove parent-exit membership and bounded termination
        shell: bash
        run: |
          systemd-run \
            --user \
            --scope \
            --quiet \
            -p Delegate=yes \
            python3 ./script/process-supervision-feasibility/linux-cgroup-membership.py
      - name: Prove membership failure is fail closed
        shell: bash
        run: |
          set +e
          systemd-run \
            --user \
            --scope \
            --quiet \
            -p Delegate=yes \
            python3 ./script/process-supervision-feasibility/linux-cgroup-membership.py \
              --inject-membership-failure
          status=$?
          set -e
          if [ "$status" -ne 42 ]; then
            echo "::error::Expected fail-closed exit 42, received $status."
            exit 1
          fi

  macos-process-group:
    name: macOS membership (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build native membership probe
        shell: bash
        run: |
          clang \
            -std=c17 \
            -Wall \
            -Wextra \
            -Werror \
            ./script/process-supervision-feasibility/macos-group-membership.c \
            -lproc \
            -o "$RUNNER_TEMP/downkyi-macos-membership"
      - name: Prove parent-exit membership and bounded termination
        shell: bash
        run: "$RUNNER_TEMP/downkyi-macos-membership"
      - name: Prove membership failure is fail closed
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/downkyi-macos-membership" --inject-membership-failure
          status=$?
          set -e
          if [ "$status" -ne 42 ]; then
            echo "::error::Expected fail-closed exit 42, received $status."
            exit 1
          fi
