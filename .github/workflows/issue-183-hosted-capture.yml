name: Issue 183 Hosted Windows Capture V3 (superseded)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  superseded:
    runs-on: windows-latest
    steps:
      - name: Stop superseded experiment
        shell: pwsh
        run: |
          @'
          This timing-triggered V3 experiment is intentionally retired.

          Known failure mode:
          - the historical 5-second generic slow-phase diagnostic can synchronously run dotnet-stack and block the observation loop;
          - the 250 ms post-teardown trigger is indirect and can miss the transient xUnit foreground-thread state;
          - preflight did not prove the exact end-to-end signal-triggered capture path.

          Use .github/workflows/issue-183-hosted-exact-capture.yml instead.
          It streams the affected test process stdout/stderr and captures a Full dump immediately when the exact xUnit watchdog appears.

          See PR #185 investigation ledger before changing this experiment again:
          https://github.com/crazysmile-PhD/downkyicore/pull/185#issuecomment-5338941604
          '@ | Write-Host
          throw 'V3 is superseded by exact watchdog-triggered Capture V4.'
