name: Issue 183 Hosted Windows Capture V3

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Sampling duration per Hosted Windows VM'
        required: false
        default: '285'
        type: string
      iterations_per_batch:
        description: 'Core lifecycle iterations per batch'
        required: false
        default: '50'
        type: string
  push:
    branches:
      - main
      - experiment/issue-183-capture-v2
    paths:
      - '.github/workflows/issue-183-hosted-capture.yml'

jobs:
  preflight:
    name: Validate capture pipeline
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Patch historical harness for dump-first capture
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          function Replace-RequiredLiteral {
            param(
              [Parameter(Mandatory)][string]$Source,
              [Parameter(Mandatory)][string]$Old,
              [Parameter(Mandatory)][string]$New,
              [Parameter(Mandatory)][string]$Label
            )
            if (-not $Source.Contains($Old,[StringComparison]::Ordinal)) {
              throw "Required patch target was not found: $Label"
            }
            return $Source.Replace($Old,$New,[StringComparison]::Ordinal)
          }

          function Replace-RequiredRegex {
            param(
              [Parameter(Mandatory)][string]$Source,
              [Parameter(Mandatory)][string]$Pattern,
              [Parameter(Mandatory)][string]$Replacement,
              [Parameter(Mandatory)][string]$Label
            )
            $regex = [regex]::new(
              $Pattern,
              [Text.RegularExpressions.RegexOptions]::Singleline)
            if (-not $regex.IsMatch($Source)) {
              throw "Required regex patch target was not found: $Label"
            }
            return $regex.Replace($Source,$Replacement)
          }

          $target = "$env:GITHUB_WORKSPACE\target"
          $harness = Join-Path $target "script\test-assembly-lifecycle.ps1"
          $content = Get-Content -LiteralPath $harness -Raw

          $content = Replace-RequiredLiteral `
            -Source $content `
            -Old '$marker?.disposed' `
            -New '${marker}?.disposed' `
            -Label 'PowerShell null-conditional marker syntax'

          $content = Replace-RequiredLiteral `
            -Source $content `
            -Old '[double]($diagnosticDurations | Measure-Object -Sum).Sum' `
            -New '[double](($diagnosticDurations | Measure-Object -Sum).Sum)' `
            -Label 'per-group diagnostic sum'
          $content = Replace-RequiredLiteral `
            -Source $content `
            -Old '[double]($diagnosticDurations | Measure-Object -Maximum).Maximum' `
            -New '[double](($diagnosticDurations | Measure-Object -Maximum).Maximum)' `
            -Label 'per-group diagnostic maximum'
          $content = Replace-RequiredLiteral `
            -Source $content `
            -Old '[double]($durations | Measure-Object -Maximum).Maximum' `
            -New '[double](($durations | Measure-Object -Maximum).Maximum)' `
            -Label 'per-group duration maximum'

          $content = Replace-RequiredRegex `
            -Source $content `
            -Pattern '\[int\]\(\s*\$transientChildResults\s*\|\s*Measure-Object\s+-Property\s+transientChildCount\s+-Sum\s*\)\.Sum' `
            -Replacement '[int](($$transientChildResults | Measure-Object -Property transientChildCount -Sum).Sum)' `
            -Label 'transient-child aggregate sum'
          $content = Replace-RequiredRegex `
            -Source $content `
            -Pattern '\[int\]\(\s*\$residualChildResults\s*\|\s*Measure-Object\s+-Property\s+residualChildCount\s+-Sum\s*\)\.Sum' `
            -Replacement '[int](($$residualChildResults | Measure-Object -Property residualChildCount -Sum).Sum)' `
            -Label 'residual-child aggregate sum'
          $content = Replace-RequiredRegex `
            -Source $content `
            -Pattern '\[double\]\(\s*\$phaseResults\s*\|\s*Measure-Object\s+-Property\s+diagnosticCaptureDurationMs\s+-Sum\s*\)\.Sum' `
            -Replacement '[double](($$phaseResults | Measure-Object -Property diagnosticCaptureDurationMs -Sum).Sum)' `
            -Label 'global diagnostic-duration aggregate sum'

          $functionOffset = $content.IndexOf(
            'function Save-ProcessEvidence',
            [StringComparison]::Ordinal)
          if ($functionOffset -lt 0) {
            throw "Could not locate Save-ProcessEvidence."
          }
          $directoryLine = '    New-Item -ItemType Directory -Force -Path $directory | Out-Null'
          $directoryOffset = $content.IndexOf(
            $directoryLine,
            $functionOffset,
            [StringComparison]::Ordinal)
          $threadOffset = $content.IndexOf(
            '    $threadSnapshot = @()',
            $functionOffset,
            [StringComparison]::Ordinal)
          if ($directoryOffset -lt 0 -or $threadOffset -lt 0) {
            throw "Could not locate dump-first injection point."
          }
          $lineEnd = $content.IndexOf("`n",$directoryOffset)
          if ($lineEnd -lt 0 -or $lineEnd -ge $threadOffset) {
            throw "Invalid dump-first injection boundary."
          }
          $insertOffset = $lineEnd + 1
          $nl = if ($content.Contains("`r`n",[StringComparison]::Ordinal)) { "`r`n" } else { "`n" }

          $inject = @(
            '',
            '    $captureSelfTest = $env:DOWNKYI_ISSUE183_CAPTURE_SELFTEST -eq "1"',
            '    if ($Reason -eq "slow-exit-after-teardown" -and -not $Process.HasExited -and',
            '        ($AssemblyName -ne "Gate.Forensics" -or $captureSelfTest)) {',
            '        $triagePath = Join-Path $directory "process-triage.dmp"',
            '        $triageLog = Join-Path $directory "process-triage-dump.log"',
            '        try {',
            '            $triageLines = @(& $env:DOWNKYI_DOTNET_DUMP collect --type Triage --process-id $Process.Id --output $triagePath 2>&1)',
            '            $triageLines | Set-Content -LiteralPath $triageLog -Encoding utf8',
            '        } catch {',
            '            ("Triage dump capture failed: " + $_.Exception.ToString()) | Set-Content -LiteralPath $triageLog -Encoding utf8',
            '        }',
            '',
            '        if (-not $Process.HasExited) {',
            '            $fullPath = Join-Path $directory "process-full.dmp"',
            '            $fullLog = Join-Path $directory "process-full-dump.log"',
            '            try {',
            '                $fullLines = @(& $env:DOWNKYI_DOTNET_DUMP collect --type Full --process-id $Process.Id --output $fullPath 2>&1)',
            '                $fullLines | Set-Content -LiteralPath $fullLog -Encoding utf8',
            '            } catch {',
            '                ("Full dump capture failed: " + $_.Exception.ToString()) | Set-Content -LiteralPath $fullLog -Encoding utf8',
            '            }',
            '        }',
            '    }',
            ''
          ) -join $nl
          $content = $content.Substring(0,$insertOffset) +
            $inject +
            $content.Substring($insertOffset)

          $triageOffset = $content.IndexOf('process-triage.dmp',$functionOffset,[StringComparison]::Ordinal)
          $threadOffsetAfterPatch = $content.IndexOf('    $threadSnapshot = @()',$functionOffset,[StringComparison]::Ordinal)
          if ($triageOffset -lt 0 -or $triageOffset -gt $threadOffsetAfterPatch) {
            throw "Triage capture is not positioned before thread enumeration."
          }

          $tokens = $null
          $parseErrors = $null
          $null = [Management.Automation.Language.Parser]::ParseInput(
            $content,[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Patched historical harness failed parser validation."
          }

          [IO.File]::WriteAllText(
            $harness,
            $content,
            [Text.UTF8Encoding]::new($false))

          $actualSha = (& git -C $target rev-parse HEAD).Trim()
          if ($actualSha -ne '0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8') {
            throw "Historical SHA mismatch: $actualSha"
          }

      - name: Validate dotnet-dump against a live managed process
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $probe = "$env:GITHUB_WORKSPACE\target\tools\DownKyi.AssemblyLifecycleProbe\bin\Release\net10.0\DownKyi.AssemblyLifecycleProbe.dll"
          $dumpTool = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $preflightRoot = "$env:GITHUB_WORKSPACE\issue-183-preflight"
          New-Item -ItemType Directory -Force $preflightRoot | Out-Null

          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = "dotnet"
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.ArgumentList.Add($probe)
          $startInfo.ArgumentList.Add("--child-hold-ms")
          $startInfo.ArgumentList.Add("20000")
          $process = [Diagnostics.Process]::new()
          $process.StartInfo = $startInfo

          try {
            if (-not $process.Start()) {
              throw "Managed hold process failed to start."
            }
            Start-Sleep -Milliseconds 250
            if ($process.HasExited) {
              throw "Managed hold process exited before dump validation."
            }

            $triage = Join-Path $preflightRoot "preflight-triage.dmp"
            & $dumpTool collect --type Triage --process-id $process.Id --output $triage
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $triage -PathType Leaf)) {
              throw "Triage dump preflight failed."
            }

            if ($process.HasExited) {
              throw "Managed hold process exited before Full dump validation."
            }
            $full = Join-Path $preflightRoot "preflight-full.dmp"
            & $dumpTool collect --type Full --process-id $process.Id --output $full
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $full -PathType Leaf)) {
              throw "Full dump preflight failed."
            }

            Write-Host "DUMP PREFLIGHT PASSED: triage=$((Get-Item $triage).Length) full=$((Get-Item $full).Length)"
          }
          finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
            $process.Dispose()
          }

      - name: Validate patched harness aggregation
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $target = "$env:GITHUB_WORKSPACE\target"
          $harness = Join-Path $target "script\test-assembly-lifecycle.ps1"
          $stackTool = "$env:GITHUB_WORKSPACE\tools\dotnet-stack.exe"
          $dumpTool = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $env:DOWNKYI_DOTNET_DUMP = $dumpTool
          Remove-Item Env:DOWNKYI_ISSUE183_CAPTURE_SELFTEST -ErrorAction SilentlyContinue

          $results = "$env:GITHUB_WORKSPACE\issue-183-preflight-harness"
          & $harness `
            -Configuration Release `
            -Profile Main `
            -Iterations 1 `
            -PhaseTimeoutSeconds 180 `
            -SlowPhaseThresholdSeconds 5 `
            -ExitThresholdSeconds 0.25 `
            -AssemblyPattern "DownKyi.Core.Tests" `
            -ResultsDirectory $results `
            -DiagnosticsToolPath $stackTool `
            -ValidateForensics `
            -NoBuild

          Write-Host "HARNESS PREFLIGHT PASSED: report aggregation completed without exception."

          $validated = "$env:GITHUB_WORKSPACE\validated-harness"
          New-Item -ItemType Directory -Force $validated | Out-Null
          Copy-Item -LiteralPath $harness -Destination (Join-Path $validated "test-assembly-lifecycle.ps1") -Force
          @(
            "Issue #183 capture V3 preflight passed."
            "Historical SHA: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8"
            "Triage/Full dump tool validation: passed"
            "Patched harness parser validation: passed"
            "Patched harness aggregation validation: passed"
            "Capture order: Triage/Full before OS-thread enumeration"
          ) | Set-Content (Join-Path $validated "preflight.txt") -Encoding utf8

      - name: Upload validated harness
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-validated-harness-v3
          path: validated-harness
          if-no-files-found: error
          retention-days: 7

  capture:
    name: Core capture / shard ${{ matrix.shard }}
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 330
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes || '285' }}
      ITERATIONS_PER_BATCH: ${{ inputs.iterations_per_batch || '50' }}

    steps:
      - name: Checkout exact historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Download validated harness
        uses: actions/download-artifact@v7
        with:
          name: issue-183-validated-harness-v3
          path: validated-harness

      - name: Install validated historical harness patch
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\validated-harness\test-assembly-lifecycle.ps1"
          $destination = "$env:GITHUB_WORKSPACE\target\script\test-assembly-lifecycle.ps1"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Validated harness artifact is missing."
          }
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $tokens = $null
          $parseErrors = $null
          $content = Get-Content -LiteralPath $destination -Raw
          $null = [Management.Automation.Language.Parser]::ParseInput(
            $content,[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw "Validated harness failed parser validation after artifact transfer."
          }

      - name: Core-only sampling with dump-first 250ms capture
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $shard = ${{ matrix.shard }}
          $target = "$env:GITHUB_WORKSPACE\target"
          $out = "$env:GITHUB_WORKSPACE\issue-183-capture-shard-$shard"
          $work = Join-Path $out "work"
          $evidence = Join-Path $out "evidence"
          $inconclusive = Join-Path $out "inconclusive"
          New-Item -ItemType Directory -Force $out,$work,$evidence,$inconclusive | Out-Null

          $harness = Join-Path $target "script\test-assembly-lifecycle.ps1"
          $stackTool = "$env:GITHUB_WORKSPACE\tools\dotnet-stack.exe"
          $dumpTool = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $env:DOWNKYI_DOTNET_DUMP = $dumpTool
          Remove-Item Env:DOWNKYI_ISSUE183_CAPTURE_SELFTEST -ErrorAction SilentlyContinue

          $watchdogText = "Waiting 10 seconds for foreground threads to exit"
          $iterations = [int]$env:ITERATIONS_PER_BATCH
          $duration = [int]$env:DURATION_MINUTES
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes($duration)

          $batch = 0
          $executions = 0
          $watchdogs = 0
          $slowExits = 0
          $triageDumps = 0
          $fullDumps = 0
          $harnessErrors = 0
          $confirmedCaptures = 0
          $events = [Collections.Generic.List[object]]::new()

          while ([DateTimeOffset]::UtcNow -lt $deadline -and $confirmedCaptures -eq 0) {
            $batch++
            $batchName = "batch-{0:D4}" -f $batch
            $batchRoot = Join-Path $work $batchName
            New-Item -ItemType Directory -Force $batchRoot | Out-Null
            Write-Host "=== shard $shard / $batchName / $iterations Core iterations ==="

            $harnessError = ""
            try {
              & $harness `
                -Configuration Release `
                -Profile Main `
                -Iterations $iterations `
                -PhaseTimeoutSeconds 180 `
                -SlowPhaseThresholdSeconds 5 `
                -ExitThresholdSeconds 0.25 `
                -AssemblyPattern "DownKyi.Core.Tests" `
                -ResultsDirectory $batchRoot `
                -DiagnosticsToolPath $stackTool `
                -ValidateForensics `
                -NoBuild
            } catch {
              $harnessError = $_.Exception.Message
              $harnessErrors++
              Write-Warning "Harness error recorded; evidence is retained: $harnessError"
            }

            $executionFiles = @(
              Get-ChildItem $batchRoot -Recurse -File -Filter "execution.stdout.txt" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match [regex]::Escape("DownKyi.Core.Tests") }
            )
            $executions += $executionFiles.Count

            $watchdogEvents = [Collections.Generic.List[object]]::new()
            foreach ($file in $executionFiles) {
              $stderrPath = Join-Path $file.Directory.FullName "execution.stderr.txt"
              $combined = Get-Content $file.FullName -Raw
              if (Test-Path $stderrPath) {
                $combined += "`n" + (Get-Content $stderrPath -Raw)
              }
              if ($combined.Contains($watchdogText,[StringComparison]::OrdinalIgnoreCase)) {
                $watchdogEvents.Add([pscustomobject]@{
                  iteration = $file.Directory.Name
                  iterationDirectory = $file.Directory.FullName
                })
              }
            }

            $slowDirs = @(
              Get-ChildItem $batchRoot -Recurse -Directory -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -like "*slow-exit-after-teardown*" -and
                  $_.FullName -match [regex]::Escape("DownKyi.Core.Tests")
                }
            )
            $triageFiles = @(
              Get-ChildItem $batchRoot -Recurse -File -Filter "process-triage.dmp" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match [regex]::Escape("DownKyi.Core.Tests") }
            )
            $fullFiles = @(
              Get-ChildItem $batchRoot -Recurse -File -Filter "process-full.dmp" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match [regex]::Escape("DownKyi.Core.Tests") }
            )

            $watchdogs += $watchdogEvents.Count
            $slowExits += $slowDirs.Count
            $triageDumps += $triageFiles.Count
            $fullDumps += $fullFiles.Count

            foreach ($event in $watchdogEvents) {
              $iterationEvidence = @(
                $slowDirs | Where-Object {
                  $_.Parent.Name -eq $event.iteration -and
                  $_.Parent.Parent.Name -eq "DownKyi.Core.Tests"
                }
              )
              $eventDumpCount = 0
              foreach ($dir in $iterationEvidence) {
                $eventDumpCount += @(
                  Get-ChildItem $dir.FullName -File -Filter "*.dmp" -ErrorAction SilentlyContinue
                ).Count
              }
              if ($eventDumpCount -gt 0) {
                $confirmedCaptures++
              }
              $events.Add([pscustomobject]@{
                shard = $shard
                batch = $batch
                assembly = "DownKyi.Core.Tests"
                iteration = $event.iteration
                watchdog = $true
                dumpCount = $eventDumpCount
                confirmedCapture = ($eventDumpCount -gt 0)
                observedAtUtc = [DateTimeOffset]::UtcNow.ToString("O")
              })
            }

            $suspicious = $watchdogEvents.Count -gt 0 -or
              $slowDirs.Count -gt 0 -or
              $triageFiles.Count -gt 0 -or
              $fullFiles.Count -gt 0 -or
              -not [string]::IsNullOrWhiteSpace($harnessError)

            if ($suspicious) {
              $retained = Join-Path $evidence $batchName
              Move-Item $batchRoot $retained
              Write-Host "TARGET SIGNAL: watchdog=$($watchdogEvents.Count) slowExit=$($slowDirs.Count) triage=$($triageFiles.Count) full=$($fullFiles.Count) confirmed=$confirmedCaptures"
            } elseif ($executionFiles.Count -ne $iterations) {
              $retained = Join-Path $inconclusive $batchName
              Move-Item $batchRoot $retained
              Write-Warning "Incomplete batch retained."
            } else {
              Remove-Item $batchRoot -Recurse -Force -ErrorAction SilentlyContinue
            }

            if ($events.Count -gt 0) {
              @($events) |
                Export-Csv (Join-Path $out "events.csv") -NoTypeInformation -Encoding utf8
            }
          }

          $summary = [ordered]@{
            schemaVersion = 3
            shard = $shard
            historicalSha = "0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8"
            batches = $batch
            coreExecutions = $executions
            watchdogExecutions = $watchdogs
            slowExitEvents = $slowExits
            triageDumps = $triageDumps
            fullDumps = $fullDumps
            confirmedCaptures = $confirmedCaptures
            harnessBatchErrors = $harnessErrors
            stoppedAfterConfirmedCapture = ($confirmedCaptures -gt 0)
            finishedAtUtc = [DateTimeOffset]::UtcNow.ToString("O")
          }
          $summary | ConvertTo-Json -Depth 6 |
            Set-Content (Join-Path $out "shard-$shard-summary.json") -Encoding utf8
          Write-Host "SHARD COMPLETE: core=$executions watchdogs=$watchdogs slow=$slowExits triage=$triageDumps full=$fullDumps confirmed=$confirmedCaptures harnessErrors=$harnessErrors"

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-capture-shard-${{ matrix.shard }}
          path: issue-183-capture-shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate capture report
    needs: capture
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: issue-183-capture-shard-*
          path: collected
          merge-multiple: true

      - name: Build capture report
        shell: pwsh
        run: |
          $summaries = @(
            Get-ChildItem collected -Recurse -File -Filter "shard-*-summary.json" -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json }
          )

          $core=0; $watchdogs=0; $slow=0; $triage=0; $full=0; $confirmed=0; $harnessErrors=0
          foreach ($s in $summaries) {
            $core += [int]$s.coreExecutions
            $watchdogs += [int]$s.watchdogExecutions
            $slow += [int]$s.slowExitEvents
            $triage += [int]$s.triageDumps
            $full += [int]$s.fullDumps
            $confirmed += [int]$s.confirmedCaptures
            $harnessErrors += [int]$s.harnessBatchErrors
          }

          $allEvents = @(
            Get-ChildItem collected -Recurse -File -Filter "events.csv" -ErrorAction SilentlyContinue |
              ForEach-Object { Import-Csv $_.FullName }
          )
          if ($allEvents.Count -gt 0) {
            $allEvents | Export-Csv issue-183-capture-events.csv -NoTypeInformation -Encoding utf8
          }

          $report = @(
            "# Issue #183 — Hosted Windows Capture V3"
            ""
            "- Historical SHA: ``0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8``"
            "- Core executions: $core"
            "- Exact watchdog executions: $watchdogs"
            "- Slow-exit-after-teardown events: $slow"
            "- Triage dumps captured: $triage"
            "- Full dumps captured: $full"
            "- **Confirmed watchdog + dump captures: $confirmed**"
            "- Harness batch errors: $harnessErrors"
            ""
            "Capture policy: fail-closed preflight; validated patched harness; Core-only; arm at 250 ms after teardown marker; capture Triage/Full before OS-thread enumeration; stop a shard after its first confirmed watchdog+dump sample."
          )
          $report | Set-Content issue-183-capture-report.md -Encoding utf8
          $report | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }

      - name: Upload aggregate capture report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-capture-report
          path: |
