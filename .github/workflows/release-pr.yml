name: Release PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - closed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  inspect:
    name: Identify release candidate
    if: ${{ contains(github.event.pull_request.body || '', '<!-- downkyi-release-candidate ') }}
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    outputs:
      is_candidate: ${{ steps.marker.outputs.is_candidate }}
      run_id: ${{ steps.marker.outputs.run_id }}
      candidate_sha: ${{ steps.marker.outputs.candidate_sha }}
    steps:
      - name: Checkout release automation
        uses: $/.github/actions/checkout
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
      - name: Read candidate marker
        id: marker
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          ./tooling/script/read-release-candidate-marker.ps1
          -PullRequestBody $env:PR_BODY
          -ActualHeadSha $env:PR_HEAD_SHA
          -GitHubOutputPath $env:GITHUB_OUTPUT

  validate:
    name: Candidate remains sealed
    needs: inspect
    if: ${{ needs.inspect.outputs.is_candidate == 'true' && github.event.action != 'closed' }}
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    steps:
      - name: Checkout release automation
        uses: $/.github/actions/checkout
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
      - name: Checkout candidate
        uses: $/.github/actions/checkout
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: subject
          fetch-depth: 0
          fetch-tags: true
      - name: Download sealed candidate
        uses: $/.github/actions/download-artifact
        with:
          pattern: release-candidate-*
          path: artifacts/release-candidate
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.inspect.outputs.run_id }}
      - name: Validate candidate identity and artifacts
        shell: pwsh
        run: >
          ./tooling/script/validate-release-candidate.ps1
          -CandidateDirectory artifacts/release-candidate
          -ExpectedCandidateSha '${{ needs.inspect.outputs.candidate_sha }}'
          -ExpectedPrepareRunId '${{ needs.inspect.outputs.run_id }}'
          -RepositoryRoot subject

  publish:
    name: Publish merged candidate
    needs: inspect
    if: ${{ needs.inspect.outputs.is_candidate == 'true' && github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release automation
        uses: $/.github/actions/checkout
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
      - name: Checkout approved candidate
        uses: $/.github/actions/checkout
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: subject
          fetch-depth: 0
          fetch-tags: true
      - name: Download the same sealed candidate
        uses: $/.github/actions/download-artifact
        with:
          pattern: release-candidate-*
          path: artifacts/release-candidate
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.inspect.outputs.run_id }}
      - name: Validate approved candidate identity and artifacts
        shell: pwsh
        run: >
          ./tooling/script/validate-release-candidate.ps1
          -CandidateDirectory artifacts/release-candidate
          -ExpectedCandidateSha '${{ needs.inspect.outputs.candidate_sha }}'
          -ExpectedPrepareRunId '${{ needs.inspect.outputs.run_id }}'
          -RepositoryRoot subject
      - name: Publish candidate tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./tooling/script/publish-release-candidate.ps1
          -CandidateDirectory artifacts/release-candidate
          -RepositoryRoot subject
          -MaximumAttempts 3
          -RetryDelaySeconds 10
