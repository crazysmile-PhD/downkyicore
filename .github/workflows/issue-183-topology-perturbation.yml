name: Issue 183 Historical Topology Perturbation V8

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      passes:
        description: 'Number of complete historical seven-assembly passes'
        required: false
        default: '3'
        type: string
      max_minutes:
        description: 'Maximum sampling time on the single Hosted Windows VM'
        required: false
        default: '120'
        type: string
  push:
    branches:
      - experiment/issue-183-capture-v2
    paths:
      - '.github/issue-183-topology-perturbation-trigger'

concurrency:
  group: issue-183-topology-perturbation-v8
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate exact observer and independent perturbation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Publish run reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 topology+perturbation V8 started: $runUrl`n`nThis tests only the interaction of the historical same-VM seven-assembly order with the independent 5-second dotnet-stack attach. The proven exact-watchdog -> same-PID Full-dump observer remains independent and unchanged."

      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install diagnostic tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          & "$env:GITHUB_WORKSPACE\tools\dotnet-stack.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'dotnet-stack preflight failed.' }

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Validate exact observer and topology probe
        shell: pwsh
        run: |
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          Push-Location $scripts
          try {
            python -m py_compile issue_183_exact_watchdog_capture.py issue_183_historical_topology_probe.py
            if ($LASTEXITCODE -ne 0) { throw 'Topology probe syntax validation failed.' }
            python issue_183_exact_watchdog_capture.py --self-test --dump-tool $dump --out "$env:GITHUB_WORKSPACE\issue-183-v8-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Exact watchdog -> Full dump preflight failed.' }
          } finally { Pop-Location }

      - name: Verify fixed historical subject and order
        shell: pwsh
        run: |
          $sha = (& git -C "$env:GITHUB_WORKSPACE\target" rev-parse HEAD).Trim()
          if ($sha -ne '0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8') { throw "Historical SHA mismatch: $sha" }
          $assemblies = @(
            'DownKyi.Application.Tests',
            'DownKyi.Architecture.Tests',
            'DownKyi.Core.Tests',
            'DownKyi.Desktop.Tests',
            'DownKyi.Domain.Tests',
            'DownKyi.Infrastructure.Tests',
            'DownKyi.Tests'
          )
          foreach ($name in $assemblies) {
            $dll = "$env:GITHUB_WORKSPACE\target\tests\$name\bin\Release\net10.0\$name.dll"
            if (-not (Test-Path $dll -PathType Leaf)) { throw "Historical assembly missing: $dll" }
          }

  interaction:
    name: Historical same-VM sequence + independent 5s attach
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PASSES: ${{ inputs.passes || '3' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '120' }}
    steps:
      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install diagnostic tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Write independent historical perturbation monitor
        shell: pwsh
        run: |
          @'
          param(
            [Parameter(Mandatory=$true)][string]$StackTool,
            [Parameter(Mandatory=$true)][string]$StopFile,
            [Parameter(Mandatory=$true)][string]$OutDir
          )
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force $OutDir | Out-Null
          $seen = @{}
          $done = @{}
          while (-not (Test-Path $StopFile)) {
            $now = [DateTime]::UtcNow
            $processes = @(Get-CimInstance Win32_Process -Filter "Name = 'dotnet.exe'" -ErrorAction SilentlyContinue)
            foreach ($process in $processes) {
              $commandLine = [string]$process.CommandLine
              if ([string]::IsNullOrWhiteSpace($commandLine)) { continue }
              if ($commandLine -notlike '*DownKyi*.Tests.dll*') { continue }
              if ($commandLine -notlike '*-automated*') { continue }
              if ($commandLine -notlike '*-parallel*none*') { continue }
              if ($commandLine -like '*-list*') { continue }

              $created = if ($process.CreationDate) { ([DateTime]$process.CreationDate).ToUniversalTime().Ticks } else { 0 }
              $key = "$($process.ProcessId)|$created"
              if ($done.ContainsKey($key)) { continue }
              if (-not $seen.ContainsKey($key)) {
                $seen[$key] = $now
                continue
              }
              if (($now - [DateTime]$seen[$key]).TotalSeconds -lt 5.0) { continue }

              $done[$key] = $true
              $stamp = [DateTime]::UtcNow.ToString('yyyyMMddTHHmmss.fffZ')
              $path = Join-Path $OutDir ("dotnet-stack-pid-{0}-{1}.txt" -f $process.ProcessId, $stamp)
              "attachStartedUtc=$([DateTime]::UtcNow.ToString('o')) pid=$($process.ProcessId) commandLine=$commandLine" | Set-Content $path -Encoding utf8
              try {
                & $StackTool report -p $process.ProcessId *>> $path
                "attachExitCode=$LASTEXITCODE attachFinishedUtc=$([DateTime]::UtcNow.ToString('o'))" | Add-Content $path -Encoding utf8
              } catch {
                "attachException=$($_.Exception.ToString())" | Add-Content $path -Encoding utf8
              }
            }
            Start-Sleep -Milliseconds 100
          }
          '@ | Set-Content "$env:GITHUB_WORKSPACE\historical-topology-perturbation-monitor.ps1" -Encoding utf8

      - name: Run historical topology with independent perturbation and exact observer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $probe = Join-Path $scripts 'issue_183_historical_topology_probe.py'
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $stack = "$env:GITHUB_WORKSPACE\tools\dotnet-stack.exe"
          $out = "$env:GITHUB_WORKSPACE\issue-183-topology-perturbation-v8"
          $perturbOut = Join-Path $out 'historical-5s-dotnet-stack'
          $stop = "$env:GITHUB_WORKSPACE\issue-183-v8-stop"
          $monitor = "$env:GITHUB_WORKSPACE\historical-topology-perturbation-monitor.ps1"
          $monitorProcess = Start-Process pwsh -WindowStyle Hidden -PassThru -ArgumentList @(
            '-NoLogo','-NoProfile','-NonInteractive','-File',$monitor,
            '-StackTool',$stack,'-StopFile',$stop,'-OutDir',$perturbOut
          )
          $probeExit = 99
          try {
            Push-Location $scripts
            try {
              python $probe `
                --repo "$env:GITHUB_WORKSPACE\target" `
                --dump-tool $dump `
                --out $out `
                --passes $env:PASSES `
                --max-minutes $env:MAX_MINUTES
              $probeExit = $LASTEXITCODE
            } finally { Pop-Location }
          } finally {
            New-Item -ItemType File -Force $stop | Out-Null
            try { Wait-Process -Id $monitorProcess.Id -Timeout 10 -ErrorAction Stop } catch { Stop-Process -Id $monitorProcess.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($probeExit -ne 0) { throw "Topology interaction probe failed closed with exit code $probeExit" }

      - name: Publish result summary
        if: always()
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\issue-183-topology-perturbation-v8"
          $summaryPath = Join-Path $root 'summary.json'
          $stackReports = @(Get-ChildItem $root -Recurse -File -Filter 'dotnet-stack-pid-*.txt' -ErrorAction SilentlyContinue).Count
          if (Test-Path $summaryPath) {
            $s = Get-Content $summaryPath -Raw | ConvertFrom-Json
            @(
              '# Issue #183 — Historical Topology + Perturbation V8',
              '',
              "- Executions: $($s.totalExecutions)",
              "- Historical 5-second dotnet-stack attaches: $stackReports",
              "- Exact watchdogs: $($s.watchdogExecutions)",
              "- Confirmed same-PID Full dumps: $($s.confirmedCaptures)",
              "- Ordinary completed test failures: $($s.ordinaryTestFailures)",
              "- Unexpected failures: $($s.unexpectedFailures)",
              "- Passes completed: $($s.passesCompleted) / $($s.passesRequested)"
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-topology-perturbation-v8
          path: issue-183-topology-perturbation-v8
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Publish completion reference
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 topology+perturbation V8 finished: $runUrl`n`nInspect exact-watchdog evidence first. If a same-PID dump exists, stop stress repetition and analyze the surviving shutdown owner immediately."
