name: Strict PR CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SOLUTION_FILE: ./DownKyi.sln

jobs:
  format:
    name: Format check
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --verbosity diagnostic
      - name: Create local-action round-trip fixture
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP 'downkyi-local-action-fixture.txt'
          Set-Content -LiteralPath $fixturePath -Value 'downkyi-local-action-round-trip' -NoNewline
      - name: Upload local-action round-trip fixture
        uses: $/.github/actions/upload-artifact
        with:
          name: local-action-round-trip-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downkyi-local-action-fixture.txt
          if-no-files-found: error
          retention-days: 1
      - name: Download local-action round-trip fixture
        uses: $/.github/actions/download-artifact
        with:
          name: local-action-round-trip-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downkyi-local-action-round-trip
      - name: Verify local-action round trip
        shell: pwsh
        run: |
          $downloadedPath = Join-Path $env:RUNNER_TEMP 'downkyi-local-action-round-trip/downkyi-local-action-fixture.txt'
          if (-not (Test-Path -LiteralPath $downloadedPath -PathType Leaf)) {
            throw 'The local upload/download action round trip did not produce the fixture.'
          }
          if ((Get-Content -LiteralPath $downloadedPath -Raw) -cne 'downkyi-local-action-round-trip') {
            throw 'The local upload/download action round trip changed the fixture content.'
          }

  build-test:
    name: Build and test (${{ matrix.check_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            check_name: windows
          - runner: ${{ vars.UBUNTU_X64_RUNNER }}
            check_name: ubuntu-x64
          - runner: macos-latest
            check_name: macos
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build with all warnings as errors
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Test
        shell: pwsh
        run: >
          ./script/test-solution.ps1
          -Configuration Release
          -NoRestore
          -NoBuild
          -ExcludeCiInfrastructure
          -ResultsDirectory ./TestResults
      - name: Classify resource-contention failure
        if: failure()
        shell: pwsh
        run: >
          ./script/classify-resource-contention.ps1
          -ResultsDirectory ./TestResults
          -OutputPath ./artifacts/test-flight-recorder/resource-contention-classification.json
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: $/.github/actions/upload-artifact
        with:
          name: test-results-${{ matrix.check_name }}
          path: |
            TestResults/*.trx
            artifacts/test-flight-recorder
          if-no-files-found: ignore
