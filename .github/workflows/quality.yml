name: Strict PR CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SOLUTION_FILE: ./DownKyi.sln

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux package fixture tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cpio rpm rpm2cpio
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --verbosity diagnostic

  code-metrics-audit:
    name: CA1506 architecture audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Audit CA1506 coupling
        shell: pwsh
        run: ./script/audit-code-metrics.ps1 -Configuration Release -NoRestore
      - name: Upload CA1506 audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ca1506-architecture-audit
          path: artifacts/code-metrics
          if-no-files-found: warn

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build with all warnings as errors
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Validate targeted resource forensics
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOWNKYI_TARGETED_RESOURCE_FORENSICS: '1'
        run: >
          ./script/test-project.ps1
          -ProjectPath tests/DownKyi.Windows.Tests/DownKyi.Windows.Tests.csproj
          -Configuration Release
          -NoRestore
          -NoBuild
          -ResultsDirectory ./TestResults
          -TrxName targeted-resource-forensics.trx
          -Filter FullyQualifiedName=DownKyi.Windows.Tests.TargetedResourceForensicsWindowsTests.ControlledDirectoryOwnerProducesCorrelatedLifecycleArtifact
          -EvidenceDirectory ./artifacts/test-flight-recorder
      - name: Test
        shell: pwsh
        run: >
          ./script/test-solution.ps1
          -Configuration Release
          -NoRestore
          -NoBuild
          -ResultsDirectory ./TestResults
      - name: Classify resource-contention failure
        if: failure()
        shell: pwsh
        run: >
          ./script/classify-resource-contention.ps1
          -ResultsDirectory ./TestResults
          -OutputPath ./artifacts/test-flight-recorder/resource-contention-classification.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/*.trx
            artifacts/test-flight-recorder
          if-no-files-found: ignore

  aria2-tls-security:
    name: aria2 TLS security (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            runner: windows-latest
            asset-argument: x86
            binary: DownKyi.Core/Binary/win-x86/aria2/aria2c.exe
          - rid: win-x64
            runner: windows-latest
            asset-argument: x64
            binary: DownKyi.Core/Binary/win-x64/aria2/aria2c.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            asset-argument: linux-x64
            binary: DownKyi.Core/Binary/linux-x64/aria2/aria2c
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            asset-argument: linux-arm64
            binary: DownKyi.Core/Binary/linux-arm64/aria2/aria2c
          - rid: osx-x64
            runner: macos-15-intel
            asset-argument: osx-x64
            binary: DownKyi.Core/Binary/osx-x64/aria2/aria2c
          - rid: osx-arm64
            runner: macos-15
            asset-argument: osx-arm64
            binary: DownKyi.Core/Binary/osx-arm64/aria2/aria2c
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Fetch and verify Windows aria2 asset
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./script/aria2.ps1 '${{ matrix.asset-argument }}'
      - name: Fetch and verify Unix aria2 asset
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: bash ./script/aria2.sh '${{ matrix.asset-argument }}'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Install ARM64 protobuf compiler
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Build TLS integration tests with all warnings as errors
        env:
          PROTOBUF_PROTOC: ${{ matrix.rid == 'linux-arm64' && '/usr/bin/protoc' || '' }}
        run: >
          dotnet build ./tests/DownKyi.Tests/DownKyi.Tests.csproj
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Verify packaged aria2 TLS behavior
        shell: pwsh
        env:
          DOWNKYI_ARIA2_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
          DOWNKYI_ARIA2_RID: ${{ matrix.rid }}
          DOWNKYI_ARIA2_TLS_REPORT: ${{ github.workspace }}/artifacts/aria2-tls/${{ matrix.rid }}.json
        run: |
          . ./script/test-project-runner.ps1
          $result = Invoke-DownKyiTestProject `
            -RepositoryRoot (Get-Location).Path `
            -ProjectPath ./tests/DownKyi.Tests/DownKyi.Tests.csproj `
            -Configuration Release `
            -NoRestore `
            -NoBuild `
            -ResultsDirectory ./artifacts/test-results/aria2-${{ matrix.rid }} `
            -ClassNames DownKyi.Tests.Aria2TlsIntegrationTests
          if ($result.ExitCode -ne 0) {
            throw "Packaged aria2 TLS integration tests failed."
          }
      - name: Upload sanitized aria2 TLS report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aria2-tls-${{ matrix.rid }}
          path: |
            artifacts/aria2-tls/${{ matrix.rid }}.json
            artifacts/test-results/aria2-${{ matrix.rid }}
            artifacts/test-flight-recorder
          if-no-files-found: warn

  package-audit:
    name: Package audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Vulnerability audit
        shell: pwsh
        run: |
          dotnet package list --project $env:SOLUTION_FILE --vulnerable --include-transitive --format json > vulnerable-packages.json
          $audit = Get-Content vulnerable-packages.json -Raw | ConvertFrom-Json
          $vulnerable = @(
            $audit.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $_ -and $_.vulnerabilities }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | ConvertTo-Json -Depth 10
            throw "Vulnerable NuGet packages found."
          }
      - name: Deprecated package audit
        shell: pwsh
        run: |
          dotnet package list --project $env:SOLUTION_FILE --deprecated --format json > deprecated-packages.json
          $report = Get-Content deprecated-packages.json -Raw | ConvertFrom-Json
          $deprecated = @(
            $report.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { $_.topLevelPackages } |
              Where-Object { $_ -and $_.deprecationReasons }
          )
          if ($deprecated.Count -gt 0) {
            $deprecated | ConvertTo-Json -Depth 10
            throw "Deprecated NuGet packages found."
          }
      - name: Upload package audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-audit
          path: |
            vulnerable-packages.json
            deprecated-packages.json
          if-no-files-found: ignore
