name: Strict PR CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SOLUTION_FILE: ./DownKyi.sln

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --verbosity diagnostic

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build with all warnings as errors
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Enforce architecture policy
        run: >
          dotnet test ./tests/DownKyi.Architecture.Tests/DownKyi.Architecture.Tests.csproj
          -c Release
          --no-restore
          --no-build
      - name: Test
        shell: pwsh
        run: >
          ./script/test-solution.ps1
          -Configuration Release
          -NoRestore
          -NoBuild
          -ResultsDirectory ./TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  assembly-lifecycle:
    name: Assembly lifecycle stability
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install lifecycle diagnostics
        run: dotnet tool install dotnet-stack --tool-path ./.tools --version 9.0.661903
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build lifecycle probe and test assemblies
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Run assembly lifecycle stability gate
        shell: pwsh
        run: |
          $profile = if ("${{ github.event_name }}" -eq "pull_request") { "PR" } else { "Main" }
          ./script/test-assembly-lifecycle.ps1 `
            -Configuration Release `
            -Profile $profile `
            -NoBuild `
            -ValidateForensics `
            -ResultsDirectory ./artifacts/assembly-lifecycle/ci
      - name: Upload lifecycle reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assembly-lifecycle-${{ github.event_name }}-${{ github.run_attempt }}
          path: artifacts/assembly-lifecycle/ci
          if-no-files-found: error

  package-audit:
    name: Package audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Vulnerability audit
        shell: pwsh
        run: |
          dotnet package list --project $env:SOLUTION_FILE --vulnerable --include-transitive --format json > vulnerable-packages.json
          $audit = Get-Content vulnerable-packages.json -Raw | ConvertFrom-Json
          $vulnerable = @(
            $audit.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $_ -and $_.vulnerabilities }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | ConvertTo-Json -Depth 10
            throw "Vulnerable NuGet packages found."
          }
      - name: Deprecated package audit
        shell: pwsh
        run: |
          dotnet package list --project $env:SOLUTION_FILE --deprecated --format json > deprecated-packages.json
          $report = Get-Content deprecated-packages.json -Raw | ConvertFrom-Json
          $deprecated = @(
            $report.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { $_.topLevelPackages } |
              Where-Object { $_ -and $_.deprecationReasons }
          )
          if ($deprecated.Count -gt 0) {
            $deprecated | ConvertTo-Json -Depth 10
            throw "Deprecated NuGet packages found."
          }
      - name: Upload package audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-audit
          path: |
            vulnerable-packages.json
            deprecated-packages.json
          if-no-files-found: ignore
