name: Strict PR CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: downkyi-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SOLUTION_FILE: ./DownKyi.sln

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate GitHub Actions syntax
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
          pyflakes: true
          shellcheck: true
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --verbosity diagnostic

  release-build:
    name: Strict Release build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build with all warnings as errors
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Write exact-head build evidence
        shell: pwsh
        run: |
          . ./script/ci-evidence.ps1
          Write-DownKyiBuildEvidence `
            -RepositoryRoot . `
            -ExpectedCommitSha '${{ github.sha }}' `
            -Platform '${{ matrix.platform }}' `
            -Configuration Release `
            -EvidencePath './artifacts/ci-evidence/build/${{ matrix.platform }}/Release/evidence.json'
      - name: Upload exact-head build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-build-${{ matrix.platform }}-Release
          path: artifacts/ci-evidence
          if-no-files-found: error

  debug-build:
    name: Debug ownership compile (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Compile Debug ownership policy
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          -c Debug
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:UseSharedCompilation=false
      - name: Write exact-head build evidence
        shell: pwsh
        run: |
          . ./script/ci-evidence.ps1
          Write-DownKyiBuildEvidence `
            -RepositoryRoot . `
            -ExpectedCommitSha '${{ github.sha }}' `
            -Platform Windows `
            -Configuration Debug `
            -EvidencePath './artifacts/ci-evidence/build/Windows/Debug/evidence.json'
      - name: Upload exact-head build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-build-Windows-Debug
          path: artifacts/ci-evidence
          if-no-files-found: error

  repository-suite:
    name: Repository suite (${{ matrix.platform }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            shard: 0
          - platform: Windows
            os: windows-latest
            shard: 1
          - platform: Linux
            os: ubuntu-latest
            shard: 0
          - platform: Linux
            os: ubuntu-latest
            shard: 1
          - platform: macOS
            os: macos-latest
            shard: 0
          - platform: macOS
            os: macos-latest
            shard: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Test required repository shard
        uses: ./.github/actions/test-solution
        with:
          results-directory: ./artifacts/ci-evidence/repository/${{ matrix.platform }}/shard-${{ matrix.shard }}
          no-restore: 'false'
          no-build: 'false'
          shard-index: '${{ matrix.shard }}'
          shard-count: '2'
          max-parallel-projects: '2'
          evidence-path: ./artifacts/ci-evidence/repository/${{ matrix.platform }}/shard-${{ matrix.shard }}/evidence.json
          expected-commit-sha: '${{ github.sha }}'
      - name: Upload repository shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-repository-${{ matrix.platform }}-${{ matrix.shard }}
          path: artifacts/ci-evidence
          if-no-files-found: error

  review-mutations:
    name: Review mutations (${{ matrix.platform }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, os: windows-latest, shard: 0 }
          - { platform: Windows, os: windows-latest, shard: 1 }
          - { platform: Windows, os: windows-latest, shard: 2 }
          - { platform: Windows, os: windows-latest, shard: 3 }
          - { platform: Linux, os: ubuntu-latest, shard: 0 }
          - { platform: Linux, os: ubuntu-latest, shard: 1 }
          - { platform: Linux, os: ubuntu-latest, shard: 2 }
          - { platform: Linux, os: ubuntu-latest, shard: 3 }
          - { platform: macOS, os: macos-latest, shard: 0 }
          - { platform: macOS, os: macos-latest, shard: 1 }
          - { platform: macOS, os: macos-latest, shard: 2 }
          - { platform: macOS, os: macos-latest, shard: 3 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Run immutable review mutation shard
        shell: pwsh
        run: >
          ./script/test-review-invariants.ps1
          -Configuration Release
          -SkipNormal
          -AdversarialShardIndex ${{ matrix.shard }}
          -AdversarialShardCount 4
          -ResultsDirectory ./artifacts/ci-evidence/review/${{ matrix.platform }}/shard-${{ matrix.shard }}
          -EvidencePath ./artifacts/ci-evidence/review/${{ matrix.platform }}/shard-${{ matrix.shard }}/evidence.json
          -ExpectedCommitSha '${{ github.sha }}'
      - name: Upload review mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-review-${{ matrix.platform }}-${{ matrix.shard }}
          path: artifacts/ci-evidence
          if-no-files-found: error

  aria2-tls-security:
    name: aria2 TLS security (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            runner: windows-latest
            asset-argument: x86
            binary: DownKyi.Core/Binary/win-x86/aria2/aria2c.exe
          - rid: win-x64
            runner: windows-latest
            asset-argument: x64
            binary: DownKyi.Core/Binary/win-x64/aria2/aria2c.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            asset-argument: linux-x64
            binary: DownKyi.Core/Binary/linux-x64/aria2/aria2c
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            asset-argument: linux-arm64
            binary: DownKyi.Core/Binary/linux-arm64/aria2/aria2c
          - rid: osx-x64
            runner: macos-15-intel
            asset-argument: osx-x64
            binary: DownKyi.Core/Binary/osx-x64/aria2/aria2c
          - rid: osx-arm64
            runner: macos-15
            asset-argument: osx-arm64
            binary: DownKyi.Core/Binary/osx-arm64/aria2/aria2c
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Fetch and verify Windows aria2 asset
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./script/aria2.ps1 '${{ matrix.asset-argument }}'
      - name: Fetch and verify Unix aria2 asset
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: bash ./script/aria2.sh '${{ matrix.asset-argument }}'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Install ARM64 protobuf compiler
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Build TLS integration tests with all warnings as errors
        env:
          PROTOBUF_PROTOC: ${{ matrix.rid == 'linux-arm64' && '/usr/bin/protoc' || '' }}
        run: >
          dotnet build ./tests/DownKyi.Tests/DownKyi.Tests.csproj
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Verify packaged aria2 TLS behavior
        uses: ./.github/actions/test-project
        env:
          DOWNKYI_ARIA2_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
          DOWNKYI_ARIA2_RID: ${{ matrix.rid }}
          DOWNKYI_ARIA2_TLS_REPORT: ${{ github.workspace }}/artifacts/aria2-tls/${{ matrix.rid }}.json
        with:
          project-path: ./tests/DownKyi.Tests/DownKyi.Tests.csproj
          no-restore: 'true'
          no-build: 'true'
          results-directory: ./TestResults/aria2-tls/${{ matrix.rid }}
          trx-name: aria2-tls-${{ matrix.rid }}.trx
          expected-class: DownKyi.Tests.Aria2TlsIntegrationTests
      - name: Upload sanitized aria2 TLS report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aria2-tls-${{ matrix.rid }}
          path: artifacts/aria2-tls/${{ matrix.rid }}.json
          if-no-files-found: warn

  assembly-lifecycle:
    name: Assembly lifecycle PR gate (${{ matrix.assembly }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        assembly:
          - DownKyi.Application.Tests
          - DownKyi.Architecture.Tests
          - DownKyi.Core.Tests
          - DownKyi.Desktop.Tests
          - DownKyi.Domain.Tests
          - DownKyi.Infrastructure.Tests
          - DownKyi.Tests
          - DownKyi.Windows.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Install lifecycle diagnostics
        run: dotnet tool install dotnet-stack --tool-path ./.tools --version 9.0.661903
      - name: Restore exact lifecycle closure
        shell: pwsh
        run: |
          dotnet restore ./tools/DownKyi.AssemblyLifecycleProbe/DownKyi.AssemblyLifecycleProbe.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore ./tools/DownKyi.ProcessSupervision/DownKyi.ProcessSupervision.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore ./tests/${{ matrix.assembly }}/${{ matrix.assembly }}.csproj
      - name: Build exact lifecycle closure
        shell: pwsh
        run: |
          $strict = @(
            '-c', 'Release', '--no-restore', '--no-incremental',
            '-p:TreatWarningsAsErrors=true',
            '-p:CodeAnalysisTreatWarningsAsErrors=true',
            '-p:EnableNETAnalyzers=true',
            '-p:AnalysisMode=All',
            '-p:EnforceCodeStyleInBuild=true',
            '-p:UseSharedCompilation=false')
          dotnet build ./tools/DownKyi.AssemblyLifecycleProbe/DownKyi.AssemblyLifecycleProbe.csproj @strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./tools/DownKyi.ProcessSupervision/DownKyi.ProcessSupervision.csproj @strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./tests/${{ matrix.assembly }}/${{ matrix.assembly }}.csproj @strict
      - name: Run sequential iterations for exact assembly
        shell: pwsh
        run: |
          $profile = if ('${{ github.event_name }}' -eq 'pull_request') { 'PR' } else { 'Main' }
          ./script/test-assembly-lifecycle.ps1 `
            -Configuration Release `
            -Profile $profile `
            -NoBuild `
            -ValidateForensics `
            -AssemblyPattern '${{ matrix.assembly }}' `
            -ResultsDirectory './artifacts/ci-evidence/lifecycle/${{ matrix.assembly }}'
      - name: Upload lifecycle reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-lifecycle-${{ matrix.assembly }}
          path: artifacts/ci-evidence
          if-no-files-found: error

  package-audit:
    name: Package audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Vulnerability audit
        shell: pwsh
        run: |
          dotnet package list --project $env:SOLUTION_FILE --vulnerable --include-transitive --format json > vulnerable-packages.json
          $audit = Get-Content vulnerable-packages.json -Raw | ConvertFrom-Json
          $vulnerable = @(
            $audit.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $_ -and $_.vulnerabilities }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | ConvertTo-Json -Depth 10
            throw "Vulnerable NuGet packages found."
          }
      - name: Deprecated package audit
        shell: pwsh
        run: |
          dotnet package list --project $env:SOLUTION_FILE --deprecated --format json > deprecated-packages.json
          $report = Get-Content deprecated-packages.json -Raw | ConvertFrom-Json
          $deprecated = @(
            $report.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { $_.topLevelPackages } |
              Where-Object { $_ -and $_.deprecationReasons }
          )
          if ($deprecated.Count -gt 0) {
            $deprecated | ConvertTo-Json -Depth 10
            throw "Deprecated NuGet packages found."
          }
      - name: Upload package audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-audit
          path: |
            vulnerable-packages.json
            deprecated-packages.json
          if-no-files-found: ignore

  required-verdict:
    name: PR required verdict
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - format
      - release-build
      - debug-build
      - repository-suite
      - review-mutations
      - aria2-tls-security
      - assembly-lifecycle
      - package-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/packages.lock.json') }}
      - name: Download exact-head shard evidence
        uses: actions/download-artifact@v8
        with:
          pattern: ci-evidence-*
          path: artifacts/ci-evidence-downloaded
          merge-multiple: true
      - name: Build semantic evidence validator
        run: |
          dotnet restore ./tools/DownKyi.CentralTestRunner/DownKyi.CentralTestRunner.csproj
          dotnet build ./tools/DownKyi.CentralTestRunner/DownKyi.CentralTestRunner.csproj -c Release --no-restore
      - name: Aggregate required exact-head evidence
        shell: pwsh
        run: >
          ./script/validate-ci-evidence.ps1
          -EvidenceRoot ./artifacts/ci-evidence-downloaded
          -ExpectedCommitSha '${{ github.sha }}'
          -ExpectedLifecycleProfile ${{ github.event_name == 'pull_request' && 'PR' || 'Main' }}
          -ReleaseBuildResult '${{ needs.release-build.result }}'
          -DebugBuildResult '${{ needs.debug-build.result }}'
          -RepositorySuiteResult '${{ needs.repository-suite.result }}'
          -ReviewMutationsResult '${{ needs.review-mutations.result }}'
          -AssemblyLifecycleResult '${{ needs.assembly-lifecycle.result }}'
          -FormatResult '${{ needs.format.result }}'
          -Aria2TlsSecurityResult '${{ needs.aria2-tls-security.result }}'
          -PackageAuditResult '${{ needs.package-audit.result }}'
