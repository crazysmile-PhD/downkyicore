name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test:
    name: Build and test (ubuntu-x64)
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
        with:
          fetch-depth: 2
      - name: Check changed files
        id: changes
        shell: pwsh
        run: |
          $paths = @(git diff --name-only HEAD^ HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the pull request diff.' }
          $code = @($paths | Where-Object { $_ -notmatch '\.md$|^docs/|^LICENSE$' })
          # The runner policy is executable input, even though it lives under docs.
          $runTests = $code.Count -gt 0 -or $paths -contains 'docs/testing/test-runner-policy.json'
          "tests=$($runTests.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $workflows = @($paths | Where-Object { $_ -like '.github/*' }).Count -gt 0
          "workflows=$($workflows.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Validate GitHub Actions workflows
        if: steps.changes.outputs.workflows == 'true'
        uses: $/.github/actions/actionlint
        with:
          files: .github/workflows/*.yml
      - name: Install .NET
        if: steps.changes.outputs.tests == 'true'
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Restore
        if: steps.changes.outputs.tests == 'true'
        run: dotnet restore ./DownKyi.sln
      - name: Build with warnings as errors
        if: steps.changes.outputs.tests == 'true'
        run: dotnet build ./DownKyi.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
      - name: Test
        if: steps.changes.outputs.tests == 'true'
        shell: pwsh
        run: >
          ./script/test-solution.ps1
          -Configuration Release
          -NoRestore
          -NoBuild
          -ProductOnly
          -ResultsDirectory ./TestResults
      - name: Upload failure evidence
        if: failure()
        continue-on-error: true
        uses: $/.github/actions/upload-artifact
        with:
          name: test-results-ubuntu-x64
          path: |
            TestResults/*.trx
            artifacts/test-flight-recorder
          if-no-files-found: ignore
