name: Build

permissions:
  contents: read
  pull-requests: read

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - release/v1.1.1-integration
    paths:
      - 'script/assets/external-assets.json'
      - 'script/ffmpeg-assets.py'
      - 'script/ffmpeg.ps1'
      - 'script/ffmpeg.sh'
      - 'script/tests/test_ffmpeg_assets.py'
      - '.github/workflows/build.yml'
      - '.github/workflows/update-ffmpeg-assets.yml'
  workflow_dispatch:
    inputs:
      update_ffmpeg_assets:
        description: 'Run the FFmpeg mirror updater from the selected branch instead of the release build.'
        required: false
        default: false
        type: boolean
      bootstrap_ffmpeg_assets:
        description: 'Import all six pinned RID sources during the first mirror run.'
        required: false
        default: false
        type: boolean

jobs:
  ffmpeg-tooling:
    name: FFmpeg tooling / implementation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate GitHub Actions workflow syntax
        uses: raven-actions/actionlint@v2
        with:
          files: .github/workflows/build.yml,.github/workflows/update-ffmpeg-assets.yml
          fail-on-error: true
          pyflakes: true
          shellcheck: true
      - name: Run FFmpeg asset guards
        run: python -m unittest script/tests/test_ffmpeg_assets.py -v

  ffmpeg-asset-updater:
    name: Update mirrored FFmpeg assets
    needs: ffmpeg-tooling
    if: ${{ inputs.update_ffmpeg_assets }}
    uses: ./.github/workflows/update-ffmpeg-assets.yml
    with:
      bootstrap: ${{ inputs.bootstrap_ffmpeg_assets }}
      manifest_base: ${{ github.ref_name }}
    secrets: inherit

  detect-production-manifest-change:
    name: Detect production manifest change
    runs-on: ubuntu-latest
    outputs:
      external_assets: ${{ steps.filter.outputs.external_assets }}
    steps:
      - name: Detect external asset manifest changes in the PR diff
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            external_assets:
              - 'script/assets/external-assets.json'

  external-assets-preflight:
    name: Production manifest preflight
    needs:
      - ffmpeg-tooling
      - detect-production-manifest-change
    if: ${{ always() && !inputs.update_ffmpeg_assets && needs.ffmpeg-tooling.result == 'success' && (github.event_name != 'pull_request' || needs.detect-production-manifest-change.outputs.external_assets == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate immutable FFmpeg manifest
        run: python script/ffmpeg-assets.py validate-manifest --manifest script/assets/external-assets.json
      - name: Check external asset availability
        run: python script/ffmpeg-assets.py preflight --manifest script/assets/external-assets.json --timeout 30

  release-gate:
    name: Release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: external-assets-preflight
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate version and tag contract
        shell: pwsh
        run: ./script/validate-release-version.ps1
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./DownKyi.sln
      - name: Strict Release build
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Test
        shell: pwsh
        run: ./script/test-solution.ps1 -Configuration Release -NoRestore -NoBuild

  assembly-lifecycle-release:
    name: Assembly lifecycle release gate
    runs-on: windows-latest
    needs: external-assets-preflight
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install lifecycle diagnostics
        run: dotnet tool install dotnet-stack --tool-path ./.tools --version 9.0.661903
      - name: Restore
        run: dotnet restore ./DownKyi.sln
      - name: Strict Release build
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Run repeated assembly lifecycle gate
        shell: pwsh
        run: >
          ./script/test-assembly-lifecycle.ps1
          -Configuration Release
          -Profile Rehearsal
          -NoBuild
          -ValidateForensics
          -ResultsDirectory ./artifacts/assembly-lifecycle/release
      - name: Upload lifecycle reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assembly-lifecycle-release-${{ github.run_attempt }}
          path: artifacts/assembly-lifecycle/release
          if-no-files-found: error

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: [release-gate, assembly-lifecycle-release]
    if: ${{ always() && needs.release-gate.result == 'success' && needs.assembly-lifecycle-release.result == 'success' }}
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate exact v1.1.3 release subject
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./script/validate-v113-release-subject.ps1 -SubjectDirectory . -ReleaseVersion '${{ github.ref_name }}' -SubjectSha '${{ github.sha }}'
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Print the changelog
        run: cat "${{ steps.git-cliff.outputs.changelog }}"
  build-windows:
    runs-on: windows-latest
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        cpu: [ x64, x86 ]
        kind: [ zip ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Python for FFmpeg manifest verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read Version Text
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw version.txt).Trim()
          "content=$version" >> $env:GITHUB_OUTPUT
      - name: Install Pupnet
        run: |
          dotnet tool install --tool-path .\.tools KuiperZone.PupNet --version 1.8.0
      - name: Get Deps
        run: |
          .\ffmpeg.ps1 ${{ matrix.cpu }}
          .\aria2.ps1 ${{ matrix.cpu }}
        working-directory: ./script
      - name: Build canonical publish
        run: >
          dotnet publish ./DownKyi/DownKyi.csproj
          -c Release
          -r win-${{ matrix.cpu }}
          --self-contained
          -p:Version=${{ steps.version.outputs.content }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./artifacts/publish/win-${{ matrix.cpu }}
      - name: Finalize and validate canonical publish payload
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ./LICENSE -Destination "artifacts/publish/win-${{ matrix.cpu }}/LICENSE"
          ./script/validate-publish-output.ps1 `
            -PublishDirectory "artifacts/publish/win-${{ matrix.cpu }}" `
            -RuntimeIdentifier "win-${{ matrix.cpu }}" `
            -ExpectedVersion "${{ steps.version.outputs.content }}" `
            -OutputPath "script/pupnet/output/expected-publish-manifest-win-${{ matrix.cpu }}.json"
      - name: Package
        run: |
          & "$env:GITHUB_WORKSPACE\.tools\pupnet.exe" DownKyi.pupnet.conf --app-version ${{ steps.version.outputs.content }} --kind ${{ matrix.kind }} -r win-${{ matrix.cpu }} -y
        working-directory: ./script/pupnet
        env:
          CANONICAL_PUBLISH_DIRECTORY: ${{ github.workspace }}/artifacts/publish/win-${{ matrix.cpu }}
      - name: Validate packaged runtime
        shell: pwsh
        run: |
          $package = "script/pupnet/output/DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}"
          ./script/validate-v113-release-package.ps1 `
            -PackagePath $package `
            -PackageKind "${{ matrix.kind }}" `
            -RuntimeIdentifier "win-${{ matrix.cpu }}" `
            -ExpectedManifestPath "script/pupnet/output/expected-publish-manifest-win-${{ matrix.cpu }}.json" `
            -OutputPath "script/pupnet/output/publish-manifest-win-${{ matrix.cpu }}.json"
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($package))" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
      - name: Upload build artifacts ${{ matrix.kind }}
        uses: actions/upload-artifact@v7
        with:
          name: DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}
          path: |
            script/pupnet/output/DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}
            script/pupnet/output/DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}.sha256
            script/pupnet/output/publish-manifest-win-${{ matrix.cpu }}.json
  build-linux-publish:
    runs-on: ubuntu-22.04
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        cpu: [ x64, arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Python for FFmpeg manifest verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read Version Text
        id: version
        run: |
          echo "content=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Get Deps
        run: |
          chmod +x ffmpeg.sh
          chmod +x aria2.sh
          ./ffmpeg.sh linux ${{ matrix.cpu }}
          ./aria2.sh linux-${{ matrix.cpu }}
        working-directory: ./script
      - name: Build canonical publish
        run: >
          dotnet publish ./DownKyi/DownKyi.csproj
          -c Release
          -r linux-${{ matrix.cpu }}
          --self-contained
          -p:Version=${{ steps.version.outputs.content }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./artifacts/publish/linux-${{ matrix.cpu }}
      - name: Finalize and validate canonical publish payload
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ./LICENSE -Destination "artifacts/publish/linux-${{ matrix.cpu }}/LICENSE"
          ./script/validate-publish-output.ps1 `
            -PublishDirectory "artifacts/publish/linux-${{ matrix.cpu }}" `
            -RuntimeIdentifier "linux-${{ matrix.cpu }}" `
            -ExpectedVersion "${{ steps.version.outputs.content }}" `
            -OutputPath "script/pupnet/output/expected-publish-manifest-linux-${{ matrix.cpu }}.json"
      - name: Verify ARM64 cross-publish host tool and target architecture
        if: ${{ matrix.cpu == 'arm64' }}
        run: |
          test "$(uname -m)" = x86_64
          protoc="$HOME/.nuget/packages/grpc.tools/2.82.0/tools/linux_x64/protoc"
          test -x "$protoc"
          file "$protoc" | grep -q 'x86-64'
          "$protoc" --version
          file artifacts/publish/linux-arm64/DownKyi | grep -qi 'ELF.*aarch64'
      - name: Create canonical Linux publish transport
        run: |
          mkdir -p artifacts/canonical-transport
          cp "script/pupnet/output/expected-publish-manifest-linux-${{ matrix.cpu }}.json" artifacts/canonical-transport/
          tar -C artifacts -cf "linux-${{ matrix.cpu }}.canonical-publish.internal.transport.tar" \
            "publish/linux-${{ matrix.cpu }}" \
            "canonical-transport/expected-publish-manifest-linux-${{ matrix.cpu }}.json"
      - name: Upload canonical Linux publish transport
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.cpu }}-canonical-publish
          path: linux-${{ matrix.cpu }}.canonical-publish.internal.transport.tar
          retention-days: 1
  build-linux:
    runs-on: ${{ matrix.os }}
    needs: [changelog, build-linux-publish]
    strategy:
      fail-fast: false
      matrix:
        cpu: [ x64, arm64 ]
        kind: [ AppImage, deb, rpm ]
        type: [ self-contained ]
        include:
          - kind: AppImage
            cpu: x64
            os: ubuntu-22.04
            package-tail: .x86_64
            package-head: DownKyi-
          - kind: deb
            cpu: x64
            os: ubuntu-22.04
            package-tail: _amd64
            package-head: downkyi_
          - kind: rpm
            cpu: x64
            os: ubuntu-22.04
            package-tail: .x86_64
            package-head: downkyi_
          - kind: AppImage
            cpu: arm64
            os: ubuntu-22.04
            package-tail: .aarch64
            package-head: DownKyi-
          - kind: deb
            cpu: arm64
            os: ubuntu-22.04
            package-tail: _arm64
            package-head: downkyi_
        exclude:
          - kind: rpm
            cpu: arm64
    steps:
      - name: Checkout packagers
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Read Version Text
        id: version
        run: |
          echo "content=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install Pupnet and package validators
        run: |
          dotnet tool install --tool-path ./.tools KuiperZone.PupNet --version 1.8.0
          sudo apt-get update
          fuse_package=libfuse2
          if ! apt-cache show "$fuse_package" >/dev/null 2>&1; then fuse_package=libfuse2t64; fi
          sudo apt-get install -y cpio "$fuse_package" rpm rpm2cpio xauth xvfb
      - name: Download canonical Linux publish
        uses: actions/download-artifact@v7
        with:
          name: linux-${{ matrix.cpu }}-canonical-publish
          path: canonical
      - name: Restore immutable canonical Linux publish
        run: |
          mkdir -p artifacts
          mkdir -p script/pupnet/output
          tar -xf "canonical/linux-${{ matrix.cpu }}.canonical-publish.internal.transport.tar" -C artifacts
          cp "artifacts/canonical-transport/expected-publish-manifest-linux-${{ matrix.cpu }}.json" script/pupnet/output/
      - name: Package
        run: |
          "$GITHUB_WORKSPACE/.tools/pupnet" DownKyi.pupnet.conf --app-version ${{ steps.version.outputs.content }} --kind ${{ matrix.kind }} -r linux-${{ matrix.cpu }} -y
        working-directory: ./script/pupnet
        env:
          CANONICAL_PUBLISH_DIRECTORY: ${{ github.workspace }}/artifacts/publish/linux-${{ matrix.cpu }}
      - name: Change Name
        run: mv "${{ matrix.package-head }}${{ steps.version.outputs.content }}-1${{ matrix.package-tail }}.${{ matrix.kind }}" "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}"
        working-directory: ./script/pupnet/output/
      - name: Validate packaged runtime
        if: ${{ matrix.cpu == 'x64' }}
        shell: pwsh
        run: |
          $package = Get-ChildItem "script/pupnet/output" -File -Filter "*${{ matrix.package-tail }}.${{ matrix.kind }}" |
            Select-Object -First 1
          if ($null -eq $package) { throw "Expected Linux package was not produced." }
          ./script/validate-v113-release-package.ps1 `
            -PackagePath $package.FullName `
            -PackageKind "${{ matrix.kind }}" `
            -RuntimeIdentifier "linux-${{ matrix.cpu }}" `
            -ExpectedManifestPath "script/pupnet/output/expected-publish-manifest-linux-${{ matrix.cpu }}.json" `
            -OutputPath "script/pupnet/output/publish-manifest-linux-${{ matrix.cpu }}-${{ matrix.kind }}.json"
          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding ascii
      - name: Create ARM64 native-validation candidate transport
        if: ${{ matrix.cpu == 'arm64' }}
        run: |
          tar -C script/pupnet/output -cf "linux-arm64-${{ matrix.kind }}.candidate.internal.transport.tar" \
            "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}" \
            "expected-publish-manifest-linux-arm64.json"
      - name: Create permission-preserving AppImage transport
        if: ${{ matrix.kind == 'AppImage' && matrix.cpu == 'x64' }}
        run: |
          tar -C script/pupnet/output -cf "appimage-${{ matrix.cpu }}.transport.tar" \
            "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}" \
            "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}.sha256" \
            "publish-manifest-linux-${{ matrix.cpu }}-${{ matrix.kind }}.json"
      - name: Upload build artifacts ${{ matrix.kind }}
        if: ${{ matrix.kind != 'AppImage' && matrix.cpu == 'x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}
          path: |
            script/pupnet/output/${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}
            script/pupnet/output/${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}.sha256
            script/pupnet/output/publish-manifest-linux-${{ matrix.cpu }}-${{ matrix.kind }}.json
      - name: Upload permission-preserving AppImage transport
        if: ${{ matrix.kind == 'AppImage' && matrix.cpu == 'x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.cpu }}-transport
          path: appimage-${{ matrix.cpu }}.transport.tar
      - name: Upload ARM64 native-validation candidate transport
        if: ${{ matrix.cpu == 'arm64' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-${{ matrix.kind }}-candidate
          path: linux-arm64-${{ matrix.kind }}.candidate.internal.transport.tar
          retention-days: 1
  validate-linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: AppImage
            package-filter: '*.aarch64.AppImage'
          - kind: deb
            package-filter: '*_arm64.deb'
    steps:
      - name: Checkout validators
        uses: actions/checkout@v7
      - name: Read Version Text
        id: version
        run: |
          echo "content=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install native AppImage validation dependencies
        run: |
          sudo apt-get update
          fuse_package=libfuse2
          if ! apt-cache show "$fuse_package" >/dev/null 2>&1; then fuse_package=libfuse2t64; fi
          sudo apt-get install -y "$fuse_package" xauth xvfb
      - name: Download ARM64 native-validation candidate
        uses: actions/download-artifact@v7
        with:
          name: linux-arm64-${{ matrix.kind }}-candidate
          path: candidate
      - name: Restore candidate transport
        run: |
          tar -xf "candidate/linux-arm64-${{ matrix.kind }}.candidate.internal.transport.tar" -C candidate
      - name: Validate native ARM64 package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem candidate -File -Filter "${{ matrix.package-filter }}")
          if ($packages.Count -ne 1) { throw "Expected exactly one ARM64 ${{ matrix.kind }} package, found $($packages.Count)." }
          $expectedManifest = "candidate/expected-publish-manifest-linux-arm64.json"
          $approvedManifest = "candidate/publish-manifest-linux-arm64-${{ matrix.kind }}.json"
          ./script/validate-v113-release-package.ps1 `
            -PackagePath $packages[0].FullName `
            -PackageKind "${{ matrix.kind }}" `
            -RuntimeIdentifier linux-arm64 `
            -ExpectedManifestPath $expectedManifest `
            -OutputPath $approvedManifest
          $hash = (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($packages[0].Name)" | Set-Content -LiteralPath "$($packages[0].FullName).sha256" -Encoding ascii
      - name: Create validated ARM64 AppImage transport
        if: ${{ matrix.kind == 'AppImage' }}
        run: |
          tar -C candidate -cf appimage-arm64.transport.tar \
            "DownKyi-${{ steps.version.outputs.content }}_linux_self-contained.aarch64.AppImage" \
            "DownKyi-${{ steps.version.outputs.content }}_linux_self-contained.aarch64.AppImage.sha256" \
            "publish-manifest-linux-arm64-AppImage.json"
      - name: Upload validated ARM64 AppImage transport
        if: ${{ matrix.kind == 'AppImage' }}
        uses: actions/upload-artifact@v7
        with:
          name: appimage-arm64-transport
          path: appimage-arm64.transport.tar
      - name: Upload validated ARM64 Debian package
        if: ${{ matrix.kind == 'deb' }}
        uses: actions/upload-artifact@v7
        with:
          name: downkyi_${{ steps.version.outputs.content }}_linux_self-contained_arm64.deb
          path: |
            candidate/downkyi_${{ steps.version.outputs.content }}_linux_self-contained_arm64.deb
            candidate/downkyi_${{ steps.version.outputs.content }}_linux_self-contained_arm64.deb.sha256
            candidate/publish-manifest-linux-arm64-deb.json
  build-macos:
    runs-on: ${{ matrix.os }}
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            os: macos-15-intel
          - cpu: arm64
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve macOS release trust mode
        shell: pwsh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "macos-release-trust.json"
          ./script/resolve-v112-macos-trust.ps1 -OutputPath $resultPath
          $trust = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          "HAS_MACOS_SIGNING=$($trust.hasMacosSigning.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "MACOS_TRUST_MODE=$($trust.macosTrustMode)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Import certificate
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      - name: Resolve signing identity
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application signing identity was imported."
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Install Tool Via HomeBrew
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=true
          brew untap aws/tap || true
          brew install create-dmg tree
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run macOS packaging regressions
        run: dotnet test tests/DownKyi.MacOS.Tests/DownKyi.MacOS.Tests.csproj -c Release
      - name: Install Python for FFmpeg manifest verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read Version Text
        id: version
        run: |
          echo "content=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Get Deps
        run: |
          chmod +x aria2.sh
          chmod +x ffmpeg.sh
          ./aria2.sh osx-${{ matrix.cpu }}
          ./ffmpeg.sh mac ${{ matrix.cpu }}
        working-directory: ./script
      - name: Build ${{ matrix.cpu }}
        run: |
          dotnet restore DownKyi/DownKyi.csproj -r osx-${{ matrix.cpu }}
          dotnet publish DownKyi/DownKyi.csproj --no-restore --self-contained -r osx-${{ matrix.cpu }} -c Release -p:DebugType=None -p:DebugSymbols=false
      - name: Package app
        run: |
          chmod +x package.sh set-bundle-version.sh
          ./package.sh ${{ matrix.cpu }} ${{ steps.version.outputs.content }}
        working-directory: ./script/macos
      - name: Validate packaged runtime
        shell: pwsh
        run: |
          ./script/validate-publish-output.ps1 `
            -PublishDirectory "DownKyi/bin/Release/net10.0/osx-${{ matrix.cpu }}/publish" `
            -RuntimeIdentifier "osx-${{ matrix.cpu }}" `
            -ExpectedVersion "${{ steps.version.outputs.content }}" `
            -OutputPath "script/macos/publish-manifest-osx-${{ matrix.cpu }}.json"
      - name: Sign app
        run: |
          chmod +x codesign-common.sh prepare-app-layout.sh sign.sh verify-app.sh verify-app-launch.sh sign-dmg.sh verify-dmg.sh verify-dmg-contents.sh verify-runtime-architecture.sh
          ./sign.sh
        working-directory: ./script/macos
        env:
          MACOS_ADHOC_SIGNING: ${{ env.HAS_MACOS_SIGNING != 'true' }}
      - name: Verify app signature
        run: |
          ./verify-app.sh
        working-directory: ./script/macos
      - name: Notarize app
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent 哔哩下载姬.app 哔哩下载姬.zip
          xcrun notarytool submit 哔哩下载姬.zip --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" --wait
          xcrun stapler staple 哔哩下载姬.app
          rm -rf ./哔哩下载姬.zip
        working-directory: ./script/macos
      - name: Verify notarized app
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ./verify-app.sh
        working-directory: ./script/macos
        env:
          MACOS_VERIFY_GATEKEEPER: true
      - name: Create DMG
        run: |
          create-dmg \
          --hdiutil-quiet \
          --icon 哔哩下载姬.app 165 175 \
          --icon-size 120 \
          --app-drop-link 495 175 \
          --window-size 660 400 \
          DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg 哔哩下载姬.app
        working-directory: ./script/macos
      - name: Sign DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ./sign-dmg.sh DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
      - name: Verify signed DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ./verify-dmg.sh DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
      - name: Notarize DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          xcrun notarytool submit DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" --wait
          xcrun stapler staple DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
      - name: Verify notarized DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ./verify-dmg.sh DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
        env:
          MACOS_VERIFY_NOTARIZATION: true
      - name: Verify packaged DMG contents and launch app
        run: |
          ./verify-dmg-contents.sh DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg ${{ steps.version.outputs.content }} osx-${{ matrix.cpu }}
        working-directory: ./script/macos
        env:
          MACOS_VERIFY_GATEKEEPER: ${{ env.HAS_MACOS_SIGNING == 'true' }}
      - name: Hash DMG
        shell: pwsh
        run: |
          $package = "script/macos/DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg"
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($package))" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg
          path: |
            script/macos/DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg
            script/macos/DownKyi-${{ steps.version.outputs.content }}-osx-${{ matrix.cpu }}.dmg.sha256
            script/macos/publish-manifest-osx-${{ matrix.cpu }}.json
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [changelog, build-windows, build-linux, validate-linux-arm64, build-macos]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout release validators
        uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Remove internal canonical and candidate transports
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File -Filter '*.internal.transport.tar' | Remove-Item
          $remainingInternalFiles = @(Get-ChildItem artifacts -Recurse -File -Filter '*.internal.*')
          if ($remainingInternalFiles.Count -ne 0) {
            throw "Internal canonical or candidate transports reached the release publication input."
          }
      - name: Restore and verify validated AppImages
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem artifacts -File -Filter 'appimage-*.transport.tar')
          if ($archives.Count -ne 2) { throw "Expected exactly two AppImage transport archives, found $($archives.Count)." }
          foreach ($archive in $archives) {
            & tar -xf $archive.FullName -C artifacts
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract $($archive.Name)." }
            Remove-Item -LiteralPath $archive.FullName
          }

          $appImages = @(Get-ChildItem artifacts -File -Filter '*.AppImage')
          if ($appImages.Count -ne 2) { throw "Expected exactly two transported AppImages, found $($appImages.Count)." }
          foreach ($appImage in $appImages) {
            $mode = [IO.File]::GetUnixFileMode($appImage.FullName)
            if (($mode -band [IO.UnixFileMode]::OtherExecute) -eq 0) {
              throw "Transported AppImage lost non-owner execute permission: $($appImage.Name)"
            }
            $sidecar = "$($appImage.FullName).sha256"
            $expectedHash = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0]
            if ($expectedHash -notmatch '^[a-fA-F0-9]{64}$') { throw "Malformed AppImage checksum: $sidecar" }
            $actualHash = (Get-FileHash -LiteralPath $appImage.FullName -Algorithm SHA256).Hash
            if (-not [String]::Equals($actualHash, $expectedHash, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Transported AppImage does not match its validated checksum: $($appImage.Name)"
            }
          }
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          artifacts: artifacts/*
          body: ${{ needs.changelog.outputs.release_body }}
