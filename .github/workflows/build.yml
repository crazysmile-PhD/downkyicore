name: Build

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'script/assets/external-assets.json'
      - 'script/ffmpeg-source/**'
      - 'script/ffmpeg.ps1'
      - 'script/ffmpeg.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  source-update-identity:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Record the exact pull request head for post-build merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n --argjson number "$PR_NUMBER" --arg head "$PR_HEAD" \
            '{number: $number, head: $head}' > "$RUNNER_TEMP/ffmpeg-update-identity.json"
      - name: Upload source update identity
        uses: $/.github/actions/upload-artifact
        with:
          name: ffmpeg-update-identity
          path: ${{ runner.temp }}/ffmpeg-update-identity.json
          if-no-files-found: error
          retention-days: 1

  external-assets-preflight:
    name: Production manifest preflight
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Verify mirrored appimagetool
        shell: pwsh
        run: ./script/install-appimagetool.ps1 -ToolPath '${{ runner.temp }}/appimagetool-preflight'

  release-gate:
    name: Release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: external-assets-preflight
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ${{ vars.UBUNTU_X64_RUNNER }}
          - macos-15
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Validate version and tag contract
        shell: pwsh
        run: ./script/validate-release-version.ps1
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ./DownKyi.sln
      - name: Strict Release build
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Test
        shell: pwsh
        run: >
          ./script/test-solution.ps1
          -Configuration Release
          -NoRestore
          -NoBuild
          -ResultsDirectory ./artifacts/test-results
      - name: Upload test results and failure diagnostics
        if: always()
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: release-gate-test-results-${{ matrix.os }}
          path: |
            artifacts/test-results
            artifacts/test-flight-recorder
          if-no-files-found: ignore

  changelog:
    name: Read version changelog
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    needs: release-gate
    if: ${{ always() && needs.release-gate.result == 'success' }}
    outputs:
      release_body: ${{ steps.release-notes.outputs.content }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
        with:
          fetch-depth: 0
      - name: Validate exact release subject
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./script/validate-release-subject.ps1 -SubjectDirectory . -ReleaseVersion '${{ github.ref_name }}' -SubjectSha '${{ github.sha }}'
      - name: Read release notes from CHANGELOG.md
        id: release-notes
        shell: pwsh
        run: |
          $notes = ./script/read-release-notes.ps1
          $delimiter = "release_notes_$([Guid]::NewGuid().ToString('N'))"
          @("content<<$delimiter", $notes, $delimiter) |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output $notes

  release-plan:
    name: Resolve release contract
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    needs: changelog
    outputs:
      validation_matrix: ${{ steps.release-contract.outputs.validation_matrix }}
    steps:
      - name: Checkout release contract
        uses: $/.github/actions/checkout
      - name: Export validation matrix from the package catalog
        id: release-contract
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath ./version.txt -Raw).Trim()
          $matrix = ./script/resolve-release-plan.ps1 `
            -ExpectedVersion $version `
            -View ValidationMatrix `
            -AsJson
          # The catalog is the release-package owner. This job only adapts it to GitHub's matrix API.
          "validation_matrix=$matrix" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        cpu: [ x64, x86 ]
        kind: [ zip ]
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Install Python for FFmpeg source build
        uses: $/.github/actions/setup-python
        with:
          python-version-file: .python-version
      - name: Read Version Text
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw version.txt).Trim()
          "content=$version" >> $env:GITHUB_OUTPUT
      - name: Install Pupnet
        shell: pwsh
        run: ./script/install-pupnet.ps1 -ToolPath ./.tools
      - name: Build FFmpeg from source
        run: |
          .\ffmpeg.ps1 ${{ matrix.cpu }}
        working-directory: ./script
      - name: Build canonical publish
        run: >
          dotnet publish ./DownKyi/DownKyi.csproj
          -c Release
          -r win-${{ matrix.cpu }}
          --self-contained
          -p:Version=${{ steps.version.outputs.content }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./artifacts/publish/win-${{ matrix.cpu }}
      - name: Finalize and validate canonical publish payload
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ./LICENSE -Destination "artifacts/publish/win-${{ matrix.cpu }}/LICENSE"
          ./script/validate-publish-output.ps1 `
            -PublishDirectory "artifacts/publish/win-${{ matrix.cpu }}" `
            -RuntimeIdentifier "win-${{ matrix.cpu }}" `
            -ExpectedVersion "${{ steps.version.outputs.content }}" `
            -OutputPath "script/pupnet/output/expected-publish-manifest-win-${{ matrix.cpu }}.json"
      - name: Package
        run: |
          & "$env:GITHUB_WORKSPACE\.tools\pupnet.exe" DownKyi.pupnet.conf --app-version ${{ steps.version.outputs.content }} --kind ${{ matrix.kind }} -r win-${{ matrix.cpu }} -y
        working-directory: ./script/pupnet
        env:
          CANONICAL_PUBLISH_DIRECTORY: ${{ github.workspace }}/artifacts/publish/win-${{ matrix.cpu }}
      - name: Validate packaged runtime
        shell: pwsh
        run: |
          $package = "script/pupnet/output/DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}"
          ./script/validate-release-package.ps1 `
            -PackagePath $package `
            -PackageKind "${{ matrix.kind }}" `
            -RuntimeIdentifier "win-${{ matrix.cpu }}" `
            -ExpectedManifestPath "script/pupnet/output/expected-publish-manifest-win-${{ matrix.cpu }}.json" `
            -OutputPath "script/pupnet/output/publish-manifest-win-${{ matrix.cpu }}.json"
          ./script/write-package-checksum.ps1 -PackagePath $package
      - name: Upload build artifacts ${{ matrix.kind }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}
          path: |
            script/pupnet/output/DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}
            script/pupnet/output/DownKyi-${{ steps.version.outputs.content }}-1.win-${{ matrix.cpu }}.${{ matrix.kind }}.sha256
            script/pupnet/output/publish-manifest-win-${{ matrix.cpu }}.json
  build-linux-publish:
    runs-on: ${{ matrix.cpu == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 240
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        cpu: [ x64, arm64 ]
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Install Python for FFmpeg source build
        uses: $/.github/actions/setup-python
        with:
          python-version-file: .python-version
      - name: Read Version Text
        id: version
        run: |
          echo "content=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Build FFmpeg from source
        run: |
          chmod +x ffmpeg.sh
          ./ffmpeg.sh linux ${{ matrix.cpu }}
        working-directory: ./script
      - name: Build canonical publish
        run: >
          dotnet publish ./DownKyi/DownKyi.csproj
          -c Release
          -r linux-${{ matrix.cpu }}
          --self-contained
          -p:Version=${{ steps.version.outputs.content }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./artifacts/publish/linux-${{ matrix.cpu }}
      - name: Finalize and validate canonical publish payload
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ./LICENSE -Destination "artifacts/publish/linux-${{ matrix.cpu }}/LICENSE"
          ./script/validate-publish-output.ps1 `
            -PublishDirectory "artifacts/publish/linux-${{ matrix.cpu }}" `
            -RuntimeIdentifier "linux-${{ matrix.cpu }}" `
            -ExpectedVersion "${{ steps.version.outputs.content }}" `
            -OutputPath "script/pupnet/output/expected-publish-manifest-linux-${{ matrix.cpu }}.json"
      - name: Verify native ARM64 publish host tool and target architecture
        if: ${{ matrix.cpu == 'arm64' }}
        run: |
          test "$(uname -m)" = aarch64
          grpc_tools_path="$(dotnet msbuild DownKyi.Core/DownKyi.Core.csproj -nologo -verbosity:quiet -getProperty:PkgGrpc_Tools -p:Configuration=Release)"
          test -n "$grpc_tools_path"
          protoc="$grpc_tools_path/tools/linux_arm64/protoc"
          test -x "$protoc"
          file "$protoc" | grep -qi 'aarch64'
          "$protoc" --version
          file artifacts/publish/linux-arm64/DownKyi | grep -qi 'ELF.*aarch64'
      - name: Create canonical Linux publish transport
        run: |
          mkdir -p artifacts/canonical-transport
          cp "script/pupnet/output/expected-publish-manifest-linux-${{ matrix.cpu }}.json" artifacts/canonical-transport/
          tar -C artifacts -cf "linux-${{ matrix.cpu }}.canonical-publish.internal.transport.tar" \
            "publish/linux-${{ matrix.cpu }}" \
            "canonical-transport/expected-publish-manifest-linux-${{ matrix.cpu }}.json"
      - name: Upload canonical Linux publish transport
        uses: $/.github/actions/upload-artifact
        with:
          name: linux-${{ matrix.cpu }}-canonical-publish
          path: linux-${{ matrix.cpu }}.canonical-publish.internal.transport.tar
          retention-days: 1
  build-linux:
    runs-on: ${{ matrix.os }}
    needs: [changelog, build-linux-publish]
    strategy:
      fail-fast: false
      matrix:
        cpu: [ x64, arm64 ]
        kind: [ AppImage, deb, rpm ]
        type: [ self-contained ]
        include:
          - kind: AppImage
            cpu: x64
            os: ubuntu-22.04
            package-tail: .x86_64
            package-head: DownKyi-
          - kind: deb
            cpu: x64
            os: ubuntu-22.04
            package-tail: _amd64
            package-head: downkyi_
          - kind: rpm
            cpu: x64
            os: ubuntu-22.04
            package-tail: .x86_64
            package-head: downkyi_
          - kind: AppImage
            cpu: arm64
            os: ubuntu-22.04
            package-tail: .aarch64
            package-head: DownKyi-
          - kind: deb
            cpu: arm64
            os: ubuntu-22.04
            package-tail: _arm64
            package-head: downkyi_
        exclude:
          - kind: rpm
            cpu: arm64
    steps:
      - name: Checkout packagers
        uses: $/.github/actions/checkout
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Read Version Text
        id: version
        run: |
          echo "content=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install Pupnet and package validators
        run: |
          pwsh ./script/install-pupnet.ps1 -ToolPath ./.tools
          sudo apt-get update
          fuse_package=libfuse2
          if ! apt-cache show "$fuse_package" >/dev/null 2>&1; then fuse_package=libfuse2t64; fi
          sudo apt-get install -y cpio "$fuse_package" rpm rpm2cpio xauth xvfb
      - name: Install mirrored appimagetool
        if: ${{ matrix.kind == 'AppImage' }}
        run: |
          pwsh ./script/install-appimagetool.ps1 -ToolPath ./.tools
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Download canonical Linux publish
        uses: $/.github/actions/download-artifact
        with:
          name: linux-${{ matrix.cpu }}-canonical-publish
          path: canonical
      - name: Restore immutable canonical Linux publish
        run: |
          mkdir -p artifacts
          mkdir -p script/pupnet/output
          tar -xf "canonical/linux-${{ matrix.cpu }}.canonical-publish.internal.transport.tar" -C artifacts
          cp "artifacts/canonical-transport/expected-publish-manifest-linux-${{ matrix.cpu }}.json" script/pupnet/output/
      - name: Package
        run: |
          "$GITHUB_WORKSPACE/.tools/pupnet" DownKyi.pupnet.conf --app-version ${{ steps.version.outputs.content }} --kind ${{ matrix.kind }} -r linux-${{ matrix.cpu }} -y
        working-directory: ./script/pupnet
        env:
          CANONICAL_PUBLISH_DIRECTORY: ${{ github.workspace }}/artifacts/publish/linux-${{ matrix.cpu }}
      - name: Change Name
        run: mv "${{ matrix.package-head }}${{ steps.version.outputs.content }}-1${{ matrix.package-tail }}.${{ matrix.kind }}" "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}"
        working-directory: ./script/pupnet/output/
      - name: Validate packaged runtime
        if: ${{ matrix.cpu == 'x64' }}
        shell: pwsh
        run: |
          $package = Get-ChildItem "script/pupnet/output" -File -Filter "*${{ matrix.package-tail }}.${{ matrix.kind }}" |
            Select-Object -First 1
          if ($null -eq $package) { throw "Expected Linux package was not produced." }
          ./script/validate-release-package.ps1 `
            -PackagePath $package.FullName `
            -PackageKind "${{ matrix.kind }}" `
            -RuntimeIdentifier "linux-${{ matrix.cpu }}" `
            -ExpectedManifestPath "script/pupnet/output/expected-publish-manifest-linux-${{ matrix.cpu }}.json" `
            -OutputPath "script/pupnet/output/publish-manifest-linux-${{ matrix.cpu }}-${{ matrix.kind }}.json"
          ./script/write-package-checksum.ps1 -PackagePath $package.FullName
      - name: Upload Linux package validation diagnostics
        if: ${{ failure() && matrix.cpu == 'x64' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: linux-${{ matrix.cpu }}-${{ matrix.kind }}-validation-diagnostics
          path: script/pupnet/output/*.failure-*
          if-no-files-found: ignore
      - name: Create ARM64 native-validation candidate transport
        if: ${{ matrix.cpu == 'arm64' }}
        run: |
          tar -C script/pupnet/output -cf "linux-arm64-${{ matrix.kind }}.candidate.internal.transport.tar" \
            "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}" \
            "expected-publish-manifest-linux-arm64.json"
      - name: Create permission-preserving AppImage transport
        if: ${{ matrix.kind == 'AppImage' && matrix.cpu == 'x64' }}
        run: |
          tar -C script/pupnet/output -cf "appimage-${{ matrix.cpu }}.transport.tar" \
            "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}" \
            "${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}.sha256" \
            "publish-manifest-linux-${{ matrix.cpu }}-${{ matrix.kind }}.json"
      - name: Upload build artifacts ${{ matrix.kind }}
        if: ${{ matrix.kind != 'AppImage' && matrix.cpu == 'x64' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: ${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}
          path: |
            script/pupnet/output/${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}
            script/pupnet/output/${{ matrix.package-head }}${{ steps.version.outputs.content }}_linux_${{ matrix.type }}${{ matrix.package-tail }}.${{ matrix.kind }}.sha256
            script/pupnet/output/publish-manifest-linux-${{ matrix.cpu }}-${{ matrix.kind }}.json
      - name: Upload permission-preserving AppImage transport
        if: ${{ matrix.kind == 'AppImage' && matrix.cpu == 'x64' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: appimage-${{ matrix.cpu }}-transport
          path: appimage-${{ matrix.cpu }}.transport.tar
      - name: Upload ARM64 native-validation candidate transport
        if: ${{ matrix.cpu == 'arm64' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: linux-arm64-${{ matrix.kind }}-candidate
          path: linux-arm64-${{ matrix.kind }}.candidate.internal.transport.tar
          retention-days: 1
  validate-linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: AppImage
            package-filter: '*.aarch64.AppImage'
          - kind: deb
            package-filter: '*_arm64.deb'
    steps:
      - name: Checkout validators
        uses: $/.github/actions/checkout
      - name: Read Version Text
        id: version
        run: |
          echo "content=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install native AppImage validation dependencies
        run: |
          sudo apt-get update
          fuse_package=libfuse2
          if ! apt-cache show "$fuse_package" >/dev/null 2>&1; then fuse_package=libfuse2t64; fi
          sudo apt-get install -y "$fuse_package" xauth xvfb
      - name: Download ARM64 native-validation candidate
        uses: $/.github/actions/download-artifact
        with:
          name: linux-arm64-${{ matrix.kind }}-candidate
          path: candidate
      - name: Restore candidate transport
        run: |
          tar -xf "candidate/linux-arm64-${{ matrix.kind }}.candidate.internal.transport.tar" -C candidate
      - name: Validate native ARM64 package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem candidate -File -Filter "${{ matrix.package-filter }}")
          if ($packages.Count -ne 1) { throw "Expected exactly one ARM64 ${{ matrix.kind }} package, found $($packages.Count)." }
          $expectedManifest = "candidate/expected-publish-manifest-linux-arm64.json"
          $approvedManifest = "candidate/publish-manifest-linux-arm64-${{ matrix.kind }}.json"
          ./script/validate-release-package.ps1 `
            -PackagePath $packages[0].FullName `
            -PackageKind "${{ matrix.kind }}" `
            -RuntimeIdentifier linux-arm64 `
            -ExpectedManifestPath $expectedManifest `
            -OutputPath $approvedManifest
          ./script/write-package-checksum.ps1 -PackagePath $packages[0].FullName
      - name: Upload ARM64 package validation diagnostics
        if: ${{ failure() }}
        uses: $/.github/actions/upload-artifact
        with:
          name: linux-arm64-${{ matrix.kind }}-validation-diagnostics
          path: candidate/*.failure-*
          if-no-files-found: ignore
      - name: Create validated ARM64 AppImage transport
        if: ${{ matrix.kind == 'AppImage' }}
        run: |
          tar -C candidate -cf appimage-arm64.transport.tar \
            "DownKyi-${{ steps.version.outputs.content }}_linux_self-contained.aarch64.AppImage" \
            "DownKyi-${{ steps.version.outputs.content }}_linux_self-contained.aarch64.AppImage.sha256" \
            "publish-manifest-linux-arm64-AppImage.json"
      - name: Upload validated ARM64 AppImage transport
        if: ${{ matrix.kind == 'AppImage' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: appimage-arm64-transport
          path: appimage-arm64.transport.tar
      - name: Upload validated ARM64 Debian package
        if: ${{ matrix.kind == 'deb' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: downkyi_${{ steps.version.outputs.content }}_linux_self-contained_arm64.deb
          path: |
            candidate/downkyi_${{ steps.version.outputs.content }}_linux_self-contained_arm64.deb
            candidate/downkyi_${{ steps.version.outputs.content }}_linux_self-contained_arm64.deb.sha256
            candidate/publish-manifest-linux-arm64-deb.json
  build-macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            os: macos-15-intel
          - cpu: arm64
            os: macos-15
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Resolve macOS release trust mode
        shell: pwsh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "macos-release-trust.json"
          ./script/resolve-v112-macos-trust.ps1 -OutputPath $resultPath
          $trust = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          "HAS_MACOS_SIGNING=$($trust.hasMacosSigning.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "MACOS_TRUST_MODE=$($trust.macosTrustMode)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Import certificate
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        uses: $/.github/actions/import-codesign-certs
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      - name: Resolve signing identity
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application signing identity was imported."
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Install Tool Via HomeBrew
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=true
          brew untap aws/tap || true
          brew install create-dmg tree
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Run macOS packaging regressions
        shell: pwsh
        run: >
          ./script/test-project.ps1
          -ProjectPath ./tests/DownKyi.MacOS.Tests/DownKyi.MacOS.Tests.csproj
          -Configuration Release
          -ResultsDirectory ./artifacts/test-results/macos-packaging-${{ matrix.cpu }}
      - name: Upload macOS packaging test results and failure diagnostics
        if: always()
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: macos-packaging-test-results-${{ matrix.cpu }}
          path: |
            artifacts/test-results/macos-packaging-${{ matrix.cpu }}
            artifacts/test-flight-recorder
          if-no-files-found: ignore
      - name: Install Python for FFmpeg source build
        uses: $/.github/actions/setup-python
        with:
          python-version-file: .python-version
      - name: Build and validate macOS app bundle
        id: macos-app
        uses: ./.github/actions/build-macos-app
        with:
          cpu: ${{ matrix.cpu }}
          manifest-path: artifacts/macos/pre-sign-publish-manifest-osx-${{ matrix.cpu }}.json
      - name: Sign app
        run: |
          chmod +x codesign-common.sh prepare-app-layout.sh sign.sh verify-app-signature.sh verify-app-loader.sh sign-dmg.sh verify-dmg.sh validate-dmg-package.sh verify-runtime-architecture.sh
          ./sign.sh
        working-directory: ./script/macos
        env:
          MACOS_ADHOC_SIGNING: ${{ env.HAS_MACOS_SIGNING != 'true' }}
      - name: Verify signed app trust
        run: ./verify-app-signature.sh
        working-directory: ./script/macos
      - name: Notarize app
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent 哔哩下载姬.app 哔哩下载姬.zip
          xcrun notarytool submit 哔哩下载姬.zip --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" --wait
          xcrun stapler staple 哔哩下载姬.app
          rm -rf ./哔哩下载姬.zip
        working-directory: ./script/macos
      - name: Verify notarized app trust
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: ./verify-app-signature.sh
        working-directory: ./script/macos
        env:
          MACOS_VERIFY_GATEKEEPER: true
      - name: Seal final signed app manifest
        shell: pwsh
        run: |
          ./script/validate-publish-output.ps1 `
            -PublishDirectory "script/macos/哔哩下载姬.app/Contents/MacOS" `
            -RuntimeIdentifier "osx-${{ matrix.cpu }}" `
            -ExpectedVersion "${{ steps.macos-app.outputs.version }}" `
            -OutputPath "script/macos/publish-manifest-osx-${{ matrix.cpu }}.json"
      - name: Create DMG
        run: |
          chmod +x create-dmg.sh
          ./create-dmg.sh ${{ steps.macos-app.outputs.version }} ${{ matrix.cpu }}
        working-directory: ./script/macos
      - name: Sign DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ./sign-dmg.sh DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
      - name: Verify signed DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ./verify-dmg.sh DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
      - name: Notarize DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          xcrun notarytool submit DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" --wait
          xcrun stapler staple DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
      - name: Verify notarized DMG
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        run: |
          ./verify-dmg.sh DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg
        working-directory: ./script/macos
        env:
          MACOS_VERIFY_NOTARIZATION: true
      - name: Validate mounted and installed macOS package contracts
        run: |
          ./validate-dmg-package.sh \
            DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg \
            ${{ steps.macos-app.outputs.version }} \
            osx-${{ matrix.cpu }} \
            publish-manifest-osx-${{ matrix.cpu }}.json
        working-directory: ./script/macos
        env:
          MACOS_VERIFY_GATEKEEPER: ${{ env.HAS_MACOS_SIGNING == 'true' }}
      - name: Hash DMG
        shell: pwsh
        run: |
          $package = "script/macos/DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg"
          ./script/write-package-checksum.ps1 -PackagePath $package
      - name: Upload build artifacts
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg
          path: |
            script/macos/DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg
            script/macos/DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg.sha256
            script/macos/publish-manifest-osx-${{ matrix.cpu }}.json
  pre-release-validation:
    name: Pre-release artifacts (${{ matrix.scope }})
    needs: [changelog, release-plan, build-windows, build-linux, validate-linux-arm64, build-macos]
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.validation_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release validators
        uses: $/.github/actions/checkout
      - name: Download all artifacts from this Build run
        if: ${{ matrix.scope == 'Inventory' }}
        uses: $/.github/actions/download-artifact
        with:
          path: artifacts
          merge-multiple: true
      - name: Download platform release artifacts from this Build run
        if: ${{ matrix.scope != 'Inventory' }}
        uses: $/.github/actions/download-artifact
        with:
          pattern: ${{ matrix.pattern }}
          path: artifacts
          merge-multiple: true
      - name: Download second platform release artifact
        if: ${{ matrix.pattern2 != '' }}
        uses: $/.github/actions/download-artifact
        with:
          pattern: ${{ matrix.pattern2 }}
          path: artifacts
          merge-multiple: true
      - name: Download third platform release artifact
        if: ${{ matrix.pattern3 != '' }}
        uses: $/.github/actions/download-artifact
        with:
          pattern: ${{ matrix.pattern3 }}
          path: artifacts
          merge-multiple: true
      - name: Install Linux package validation dependencies
        if: ${{ startsWith(matrix.scope, 'Linux') }}
        run: |
          sudo apt-get update
          fuse_package=libfuse2
          if ! apt-cache show "$fuse_package" >/dev/null 2>&1; then fuse_package=libfuse2t64; fi
          sudo apt-get install -y cpio "$fuse_package" rpm rpm2cpio xauth xvfb
      - name: Revalidate downloaded release artifacts without rebuilding
        shell: pwsh
        run: |
          ./script/validate-build-run-artifacts.ps1 `
            -ArtifactDirectory ./artifacts `
            -Scope '${{ matrix.scope }}' `
            -OutputDirectory ./artifacts/pre-release-validation
      - name: Upload downloaded package validation diagnostics
        if: ${{ failure() && (matrix.scope == 'Windows' || startsWith(matrix.scope, 'Linux')) }}
        uses: $/.github/actions/upload-artifact
        with:
          name: pre-release-${{ matrix.scope }}-validation-diagnostics
          path: artifacts/pre-release-validation/*.failure-*
          if-no-files-found: ignore

  release:
    name: Publish release
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    permissions:
      contents: write
    needs: [changelog, pre-release-validation]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout release validators
        uses: $/.github/actions/checkout
      - name: Download build artifacts
        uses: $/.github/actions/download-artifact
        with:
          path: artifacts
          merge-multiple: true
      - name: Recheck and prepare downloaded release artifacts
        shell: pwsh
        run: |
          ./script/validate-build-run-artifacts.ps1 `
            -ArtifactDirectory ./artifacts `
            -Scope Inventory `
            -OutputDirectory ./artifacts/pre-release-validation
      - name: Assemble public release assets
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath ./version.txt -Raw).Trim()
          ./script/assemble-release-assets.ps1 `
            -ArtifactsDirectory artifacts `
            -ExpectedVersion $version `
            -OutputDirectory artifacts/release-assets
      - name: Release
        uses: $/.github/actions/release
        with:
          allowUpdates: false
          artifactErrorsFailBuild: true
          artifacts: artifacts/release-assets/*
          body: ${{ needs.changelog.outputs.release_body }}
          immutableCreate: true
          replacesArtifacts: false
      - name: Verify published release identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJsonPath = './artifacts/published-release.json'
          gh api `
            -H 'Accept: application/vnd.github+json' `
            -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" > $releaseJsonPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read back the published GitHub Release.'
          }
          ./script/verify-published-release.ps1 `
            -ReleaseJsonPath $releaseJsonPath `
            -AssetDirectory ./artifacts/release-assets `
            -ExpectedTag $env:GITHUB_REF_NAME
