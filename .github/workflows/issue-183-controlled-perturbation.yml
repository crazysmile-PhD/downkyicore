name: Issue 183 Controlled Historical Perturbation V5

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Sampling duration per Hosted Windows VM'
        required: false
        default: '180'
        type: string
      max_iterations:
        description: 'Maximum Core executions per shard'
        required: false
        default: '4000'
        type: string
  push:
    branches:
      - experiment/issue-183-capture-v2
    paths:
      - '.github/issue-183-perturbation-trigger'

concurrency:
  group: issue-183-controlled-perturbation-v5
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate exact observer and perturbation tool
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Publish run reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 controlled historical-perturbation run started: $runUrl`n`nThis preserves the V4 exact watchdog -> Full-dump observer and restores only the historical 5-second dotnet-stack attach as an independent external perturbation."

      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install diagnostic tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          & "$env:GITHUB_WORKSPACE\tools\dotnet-stack.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'dotnet-stack preflight failed.' }

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Validate exact observer and end-to-end dump trigger
        shell: pwsh
        run: |
          $observer = "$env:GITHUB_WORKSPACE\instrumentation\script\research\issue_183_exact_watchdog_capture.py"
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          python -m py_compile $observer
          if ($LASTEXITCODE -ne 0) { throw 'Exact observer syntax validation failed.' }
          python $observer --self-test --dump-tool $dump --out "$env:GITHUB_WORKSPACE\issue-183-v5-preflight"
          if ($LASTEXITCODE -ne 0) { throw 'Exact watchdog -> Full dump preflight failed.' }

      - name: Verify fixed historical subject
        shell: pwsh
        run: |
          $target = "$env:GITHUB_WORKSPACE\target"
          $sha = (& git -C $target rev-parse HEAD).Trim()
          if ($sha -ne '0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8') { throw "Historical SHA mismatch: $sha" }
          $assembly = Join-Path $target 'tests\DownKyi.Core.Tests\bin\Release\net10.0\DownKyi.Core.Tests.dll'
          if (-not (Test-Path $assembly -PathType Leaf)) { throw 'Historical Core assembly missing.' }

  capture:
    name: Historical attach perturbation / shard ${{ matrix.shard }}
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 225
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes || '180' }}
      MAX_ITERATIONS: ${{ inputs.max_iterations || '4000' }}

    steps:
      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install diagnostic tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Write independent historical perturbation monitor
        shell: pwsh
        run: |
          @'
          param(
            [Parameter(Mandatory=$true)][string]$StackTool,
            [Parameter(Mandatory=$true)][string]$StopFile,
            [Parameter(Mandatory=$true)][string]$OutDir
          )
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force $OutDir | Out-Null
          $seen = @{}
          $done = @{}
          while (-not (Test-Path $StopFile)) {
            $now = [DateTime]::UtcNow
            $processes = @(Get-CimInstance Win32_Process -Filter "Name = 'dotnet.exe'" -ErrorAction SilentlyContinue)
            foreach ($process in $processes) {
              $commandLine = [string]$process.CommandLine
              if ([string]::IsNullOrWhiteSpace($commandLine)) { continue }
              if ($commandLine -notlike '*DownKyi.Core.Tests.dll*') { continue }
              if ($commandLine -notlike '*-automated*') { continue }
              if ($commandLine -notlike '*-parallel*none*') { continue }
              if ($commandLine -like '*-list*') { continue }

              $created = if ($process.CreationDate) { ([DateTime]$process.CreationDate).ToUniversalTime().Ticks } else { 0 }
              $key = "$($process.ProcessId)|$created"
              if ($done.ContainsKey($key)) { continue }
              if (-not $seen.ContainsKey($key)) {
                $seen[$key] = $now
                continue
              }
              if (($now - [DateTime]$seen[$key]).TotalSeconds -lt 5.0) { continue }

              $done[$key] = $true
              $stamp = [DateTime]::UtcNow.ToString('yyyyMMddTHHmmss.fffZ')
              $path = Join-Path $OutDir ("dotnet-stack-pid-{0}-{1}.txt" -f $process.ProcessId, $stamp)
              "attachStartedUtc=$([DateTime]::UtcNow.ToString('o')) pid=$($process.ProcessId)" | Set-Content $path -Encoding utf8
              try {
                & $StackTool report -p $process.ProcessId *>> $path
                "attachExitCode=$LASTEXITCODE attachFinishedUtc=$([DateTime]::UtcNow.ToString('o'))" | Add-Content $path -Encoding utf8
              } catch {
                "attachException=$($_.Exception.ToString())" | Add-Content $path -Encoding utf8
              }
            }
            Start-Sleep -Milliseconds 100
          }
          '@ | Set-Content "$env:GITHUB_WORKSPACE\historical-perturbation-monitor.ps1" -Encoding utf8

      - name: Sample with independent 5-second dotnet-stack perturbation
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $observer = "$env:GITHUB_WORKSPACE\instrumentation\script\research\issue_183_exact_watchdog_capture.py"
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $stack = "$env:GITHUB_WORKSPACE\tools\dotnet-stack.exe"
          $out = "$env:GITHUB_WORKSPACE\issue-183-v5-shard-${{ matrix.shard }}"
          $perturbOut = Join-Path $out 'historical-5s-dotnet-stack'
          $stop = "$env:GITHUB_WORKSPACE\issue-183-v5-stop-${{ matrix.shard }}"
          $monitor = "$env:GITHUB_WORKSPACE\historical-perturbation-monitor.ps1"
          $monitorProcess = Start-Process pwsh -WindowStyle Hidden -PassThru -ArgumentList @(
            '-NoLogo','-NoProfile','-NonInteractive','-File',$monitor,
            '-StackTool',$stack,'-StopFile',$stop,'-OutDir',$perturbOut
          )
          $observerExit = 99
          try {
            python $observer `
              --repo "$env:GITHUB_WORKSPACE\target" `
              --dump-tool $dump `
              --out $out `
              --duration-minutes $env:DURATION_MINUTES `
              --max-iterations $env:MAX_ITERATIONS
            $observerExit = $LASTEXITCODE
          } finally {
            New-Item -ItemType File -Force $stop | Out-Null
            try { Wait-Process -Id $monitorProcess.Id -Timeout 10 -ErrorAction Stop } catch { Stop-Process -Id $monitorProcess.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($observerExit -ne 0) { throw "Exact sampler failed closed with exit code $observerExit" }

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-v5-shard-${{ matrix.shard }}
          path: issue-183-v5-shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

  aggregate:
    name: Aggregate controlled perturbation report
    needs: capture
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download shard artifacts without flattening
        uses: actions/download-artifact@v7
        with:
          pattern: issue-183-v5-shard-*
          path: collected
          merge-multiple: false

      - name: Build aggregate report
        shell: pwsh
        run: |
          $summaries = @(
            Get-ChildItem collected -Recurse -File -Filter summary.json -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json }
          )
          $iterations = 0; $watchdogs = 0; $captures = 0; $phaseFailures = 0
          foreach ($s in $summaries) {
            $iterations += [int]$s.iterations
            $watchdogs += [int]$s.watchdogExecutions
            $captures += [int]$s.confirmedCaptures
            $phaseFailures += [int]$s.phaseFailures
          }
          $stackReports = @(Get-ChildItem collected -Recurse -File -Filter 'dotnet-stack-pid-*.txt' -ErrorAction SilentlyContinue).Count
          $report = @(
            '# Issue #183 — Controlled historical perturbation V5'
            ''
            '- Historical SHA: `0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8`'
            '- Changed variable: independent `dotnet-stack report` attach after an execution remains alive for 5 seconds.'
            '- Exact watchdog observer: unchanged V4 stdout/stderr reader -> same-PID Full dump.'
            "- Shard summaries: $($summaries.Count) / 6"
            "- Core executions: $iterations"
            "- Historical 5-second dotnet-stack attaches: $stackReports"
            "- Exact watchdog executions: $watchdogs"
            "- **Confirmed exact-watchdog + Full-dump captures: $captures**"
            "- Other retained phase failures: $phaseFailures"
          )
          if ($captures -gt 0) {
            $report += ''
            $report += '**Result:** watchdog-correlated dump acquired under the restored historical perturbation. Stop stress and analyze the dump immediately.'
          } elseif ($watchdogs -gt 0) {
            $report += ''
            $report += '**Result:** watchdog reproduced but same-PID Full dump failed; instrumentation failure, do not increase stress.'
          } else {
            $report += ''
            $report += '**Result:** restoring the historical 5-second dotnet-stack attach did not reproduce the watchdog in this controlled sample.'
          }
          $report | Set-Content issue-183-v5-report.md -Encoding utf8
          $report | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }

      - name: Publish completion reference
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 controlled historical-perturbation run finished: $runUrl`n`nInspect ``issue-183-v5-report`` and retained shard evidence before any next change."

      - name: Upload aggregate report
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-v5-report
          path: issue-183-v5-report.md
          retention-days: 30
