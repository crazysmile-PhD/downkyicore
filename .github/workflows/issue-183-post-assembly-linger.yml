name: Issue 183 Post-Assembly Linger Capture V10

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        required: false
        default: '285'
        type: string
      max_iterations:
        required: false
        default: '5000'
        type: string
      linger_ms:
        required: false
        default: '500'
        type: string
  push:
    branches:
      - experiment/issue-183-capture-v2
    paths:
      - '.github/issue-183-post-assembly-linger-trigger'

concurrency:
  group: issue-183-post-assembly-linger-v10
  cancel-in-progress: true

env:
  HISTORICAL_SHA: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
  HISTORICAL_SDK: 10.0.302
  HISTORICAL_RUNTIME: 10.0.10

jobs:
  preflight:
    name: Validate post-assembly linger -> Full dump -> watchdog correlation
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Publish run reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 V10 post-assembly linger capture started: $runUrl`n`nThis changes the capture window, not production behavior: after ``test-assembly-finished``, a still-live target at 500 ms is dumped before the one-second xUnit watchdog. Exact watchdog correlation remains mandatory."

      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HISTORICAL_SHA }}
          fetch-depth: 0
          path: target

      - name: Install exact historical .NET SDK and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\dotnet-historical"
          $installer = "$env:RUNNER_TEMP\dotnet-install.ps1"
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          $sdk = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Version',$env:HISTORICAL_SDK,'-NoPath')
          if ($sdk.ExitCode -ne 0) { throw "Historical SDK installer exit code $($sdk.ExitCode)" }
          $runtime = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Runtime','dotnet','-Version',$env:HISTORICAL_RUNTIME,'-NoPath')
          if ($runtime.ExitCode -ne 0) { throw "Historical runtime installer exit code $($runtime.ExitCode)" }
          if ((& "$root\dotnet.exe" --version).Trim() -ne $env:HISTORICAL_SDK) { throw 'Historical SDK mismatch.' }
          if (-not (@(& "$root\dotnet.exe" --list-runtimes) -match "Microsoft.NETCore.App $([regex]::Escape($env:HISTORICAL_RUNTIME)) ")) { throw 'Historical runtime mismatch.' }
          "DOTNET_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $root | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dotnet-dump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore and strict-build historical checkout
        working-directory: target
        shell: pwsh
        run: |
          dotnet restore ./DownKyi.sln
          if ($LASTEXITCODE -ne 0) { throw 'Historical restore failed.' }
          dotnet build ./DownKyi.sln -c Release --no-restore --no-incremental -p:TreatWarningsAsErrors=true -p:CodeAnalysisTreatWarningsAsErrors=true -p:EnableNETAnalyzers=true -p:AnalysisMode=All -p:EnforceCodeStyleInBuild=true -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Historical build failed.' }

      - name: Validate observer syntax and end-to-end pre-arm capture
        shell: pwsh
        run: |
          $observer = "$env:GITHUB_WORKSPACE\instrumentation\script\research\issue_183_post_assembly_linger_capture.py"
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $out = "$env:GITHUB_WORKSPACE\issue-183-v10-preflight"
          python -m py_compile $observer
          if ($LASTEXITCODE -ne 0) { throw 'V10 observer syntax failed.' }
          python $observer --self-test --dump-tool $dump --out $out --linger-ms 500
          if ($LASTEXITCODE -ne 0) { throw 'V10 post-assembly capture self-test failed.' }

      - name: Upload preflight proof
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-v10-preflight
          path: issue-183-v10-preflight
          if-no-files-found: error
          retention-days: 7

  capture:
    name: Post-assembly capture / shard ${{ matrix.shard }}
    needs: preflight
    runs-on: windows-2025-vs2026
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes || '285' }}
      MAX_ITERATIONS: ${{ inputs.max_iterations || '5000' }}
      LINGER_MS: ${{ inputs.linger_ms || '500' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HISTORICAL_SHA }}
          fetch-depth: 0
          path: target

      - name: Install exact historical .NET SDK and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\dotnet-historical"
          $installer = "$env:RUNNER_TEMP\dotnet-install.ps1"
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          $sdk = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Version',$env:HISTORICAL_SDK,'-NoPath')
          if ($sdk.ExitCode -ne 0) { throw "Historical SDK installer exit code $($sdk.ExitCode)" }
          $runtime = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Runtime','dotnet','-Version',$env:HISTORICAL_RUNTIME,'-NoPath')
          if ($runtime.ExitCode -ne 0) { throw "Historical runtime installer exit code $($runtime.ExitCode)" }
          "DOTNET_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $root | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dotnet-dump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore and strict-build historical checkout
        working-directory: target
        shell: pwsh
        run: |
          dotnet restore ./DownKyi.sln
          if ($LASTEXITCODE -ne 0) { throw 'Historical restore failed.' }
          dotnet build ./DownKyi.sln -c Release --no-restore --no-incremental -p:TreatWarningsAsErrors=true -p:CodeAnalysisTreatWarningsAsErrors=true -p:EnableNETAnalyzers=true -p:AnalysisMode=All -p:EnforceCodeStyleInBuild=true -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Historical build failed.' }

      - name: Sample historical Core with post-assembly pre-arm capture
        shell: pwsh
        run: |
          $observer = "$env:GITHUB_WORKSPACE\instrumentation\script\research\issue_183_post_assembly_linger_capture.py"
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $out = "$env:GITHUB_WORKSPACE\issue-183-v10-shard-${{ matrix.shard }}"
          python $observer --repo "$env:GITHUB_WORKSPACE\target" --dump-tool $dump --out $out --duration-minutes $env:DURATION_MINUTES --max-iterations $env:MAX_ITERATIONS --linger-ms $env:LINGER_MS
          if ($LASTEXITCODE -ne 0) { throw "V10 sampler failed closed with exit code $LASTEXITCODE" }

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-v10-shard-${{ matrix.shard }}
          path: issue-183-v10-shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

  aggregate:
    name: Aggregate V10 report
    needs: capture
    if: always()
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: issue-183-v10-shard-*
          path: collected
          merge-multiple: false

      - name: Build aggregate report
        shell: pwsh
        run: |
          $summaries = @(Get-ChildItem collected -Recurse -File -Filter summary.json | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json })
          $iterations = 0; $watchdogs = 0; $confirmed = 0; $lingerOnly = 0; $failures = 0
          foreach ($s in $summaries) {
            $iterations += [int]$s.iterations
            $watchdogs += [int]$s.watchdogExecutions
            $confirmed += [int]$s.confirmedCaptures
            $lingerOnly += [int]$s.lingerOnlyCaptures
            $failures += [int]$s.phaseFailures
          }
          @(
            '# Issue #183 — V10 post-assembly linger capture'
            ''
            "- Shard summaries: $($summaries.Count) / 6"
            "- Core executions: $iterations"
            "- Exact watchdogs: $watchdogs"
            "- Confirmed watchdog + same-PID Full dumps: $confirmed"
            "- Post-assembly linger dumps without later watchdog: $lingerOnly"
            "- Other phase failures: $failures"
            ''
            'Capture policy: only after xUnit emits test-assembly-finished and the same PID is still alive 500 ms later; stdout/stderr reader threads remain independent; exact watchdog correlation is still required for #183 attribution.'
          ) | Tee-Object -FilePath issue-183-v10-report.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish completion reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 V10 post-assembly linger capture finished: $runUrl`n`nIf a watchdog-correlated Full dump exists, stop repetition and analyze its surviving thread ownership immediately."

      - uses: actions/upload-artifact@v7
        with:
          name: issue-183-v10-report
          path: issue-183-v10-report.md
          retention-days: 30
