name: Issue 183 Historical Toolchain V9B

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      passes:
        description: 'Number of complete historical seven-assembly passes'
        required: false
        default: '3'
        type: string
      max_minutes:
        description: 'Maximum sampling time on the single Hosted Windows VM'
        required: false
        default: '120'
        type: string
  push:
    branches:
      - experiment/issue-183-capture-v2
    paths:
      - '.github/issue-183-historical-toolchain-v9b-trigger'

concurrency:
  group: issue-183-historical-toolchain-v9b
  cancel-in-progress: true

env:
  HISTORICAL_SHA: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
  HISTORICAL_SDK: 10.0.302
  HISTORICAL_RUNTIME: 10.0.10

jobs:
  preflight:
    name: Validate historical toolchain and exact observer
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Publish run reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 historical .NET toolchain V9B started: $runUrl`n`nThis is the repaired V9 control: exact SDK 10.0.302 + Runtime 10.0.10 in isolated DOTNET_ROOT. Subject, historical topology, independent 5-second attach, and exact watchdog -> same-PID Full-dump observer are unchanged."

      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HISTORICAL_SHA }}
          fetch-depth: 0
          path: target

      - name: Install exact historical .NET SDK and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\dotnet-historical"
          $installer = "$env:RUNNER_TEMP\dotnet-install.ps1"
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          $sdkInstall = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Version',$env:HISTORICAL_SDK,'-NoPath')
          if ($sdkInstall.ExitCode -ne 0) { throw "Historical SDK installer exit code $($sdkInstall.ExitCode)" }
          $runtimeInstall = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Runtime','dotnet','-Version',$env:HISTORICAL_RUNTIME,'-NoPath')
          if ($runtimeInstall.ExitCode -ne 0) { throw "Historical runtime installer exit code $($runtimeInstall.ExitCode)" }
          if (-not (Test-Path "$root\dotnet.exe")) { throw 'Historical dotnet.exe was not installed.' }
          $sdk = (& "$root\dotnet.exe" --version).Trim()
          if ($sdk -ne $env:HISTORICAL_SDK) { throw "SDK mismatch: $sdk" }
          $runtimes = @(& "$root\dotnet.exe" --list-runtimes)
          if (-not ($runtimes -match "Microsoft.NETCore.App $([regex]::Escape($env:HISTORICAL_RUNTIME)) ")) { throw "Historical runtime missing: $($runtimes -join '; ')" }
          "DOTNET_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $root | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & "$root\dotnet.exe" --info

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install diagnostic tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore and strict-build historical checkout
        working-directory: target
        shell: pwsh
        run: |
          dotnet restore ./DownKyi.sln
          if ($LASTEXITCODE -ne 0) { throw 'Historical restore failed.' }
          dotnet build ./DownKyi.sln -c Release --no-restore --no-incremental -p:TreatWarningsAsErrors=true -p:CodeAnalysisTreatWarningsAsErrors=true -p:EnableNETAnalyzers=true -p:AnalysisMode=All -p:EnforceCodeStyleInBuild=true -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Historical build failed.' }

      - name: Validate fixed subject and exact observer
        shell: pwsh
        run: |
          $sha = (& git -C "$env:GITHUB_WORKSPACE\target" rev-parse HEAD).Trim()
          if ($sha -ne $env:HISTORICAL_SHA) { throw "Historical SHA mismatch: $sha" }
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          Push-Location $scripts
          try {
            python -m py_compile issue_183_exact_watchdog_capture.py issue_183_historical_topology_probe.py
            if ($LASTEXITCODE -ne 0) { throw 'Probe syntax validation failed.' }
            python issue_183_exact_watchdog_capture.py --self-test --dump-tool $dump --out "$env:GITHUB_WORKSPACE\issue-183-v9b-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Exact watchdog -> Full dump preflight failed.' }
          } finally { Pop-Location }

  experiment:
    name: Historical topology + perturbation + historical .NET
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PASSES: ${{ inputs.passes || '3' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '120' }}
    steps:
      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HISTORICAL_SHA }}
          fetch-depth: 0
          path: target

      - name: Install exact historical .NET SDK and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\dotnet-historical"
          $installer = "$env:RUNNER_TEMP\dotnet-install.ps1"
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          $sdkInstall = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Version',$env:HISTORICAL_SDK,'-NoPath')
          if ($sdkInstall.ExitCode -ne 0) { throw "Historical SDK installer exit code $($sdkInstall.ExitCode)" }
          $runtimeInstall = Start-Process pwsh -Wait -PassThru -NoNewWindow -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$installer,'-InstallDir',$root,'-Runtime','dotnet','-Version',$env:HISTORICAL_RUNTIME,'-NoPath')
          if ($runtimeInstall.ExitCode -ne 0) { throw "Historical runtime installer exit code $($runtimeInstall.ExitCode)" }
          if (-not (Test-Path "$root\dotnet.exe")) { throw 'Historical dotnet.exe was not installed.' }
          $sdk = (& "$root\dotnet.exe" --version).Trim()
          if ($sdk -ne $env:HISTORICAL_SDK) { throw "SDK mismatch: $sdk" }
          $runtimes = @(& "$root\dotnet.exe" --list-runtimes)
          if (-not ($runtimes -match "Microsoft.NETCore.App $([regex]::Escape($env:HISTORICAL_RUNTIME)) ")) { throw "Historical runtime missing: $($runtimes -join '; ')" }
          "DOTNET_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $root | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & "$root\dotnet.exe" --info

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install diagnostic tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903
          dotnet tool install dotnet-stack --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore and strict-build historical checkout
        working-directory: target
        shell: pwsh
        run: |
          dotnet restore ./DownKyi.sln
          if ($LASTEXITCODE -ne 0) { throw 'Historical restore failed.' }
          dotnet build ./DownKyi.sln -c Release --no-restore --no-incremental -p:TreatWarningsAsErrors=true -p:CodeAnalysisTreatWarningsAsErrors=true -p:EnableNETAnalyzers=true -p:AnalysisMode=All -p:EnforceCodeStyleInBuild=true -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Historical build failed.' }

      - name: Write independent historical perturbation monitor
        shell: pwsh
        run: |
          @'
          param(
            [Parameter(Mandatory=$true)][string]$StackTool,
            [Parameter(Mandatory=$true)][string]$StopFile,
            [Parameter(Mandatory=$true)][string]$OutDir
          )
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force $OutDir | Out-Null
          $seen = @{}
          $done = @{}
          while (-not (Test-Path $StopFile)) {
            $now = [DateTime]::UtcNow
            $processes = @(Get-CimInstance Win32_Process -Filter "Name = 'dotnet.exe'" -ErrorAction SilentlyContinue)
            foreach ($process in $processes) {
              $commandLine = [string]$process.CommandLine
              if ([string]::IsNullOrWhiteSpace($commandLine)) { continue }
              if ($commandLine -notlike '*DownKyi*.Tests.dll*') { continue }
              if ($commandLine -notlike '*-automated*') { continue }
              if ($commandLine -notlike '*-parallel*none*') { continue }
              if ($commandLine -like '*-list*') { continue }
              $created = if ($process.CreationDate) { ([DateTime]$process.CreationDate).ToUniversalTime().Ticks } else { 0 }
              $key = "$($process.ProcessId)|$created"
              if ($done.ContainsKey($key)) { continue }
              if (-not $seen.ContainsKey($key)) { $seen[$key] = $now; continue }
              if (($now - [DateTime]$seen[$key]).TotalSeconds -lt 5.0) { continue }
              $done[$key] = $true
              $stamp = [DateTime]::UtcNow.ToString('yyyyMMddTHHmmss.fffZ')
              $path = Join-Path $OutDir ("dotnet-stack-pid-{0}-{1}.txt" -f $process.ProcessId, $stamp)
              "attachStartedUtc=$([DateTime]::UtcNow.ToString('o')) pid=$($process.ProcessId) commandLine=$commandLine" | Set-Content $path -Encoding utf8
              try {
                & $StackTool report -p $process.ProcessId *>> $path
                "attachExitCode=$LASTEXITCODE attachFinishedUtc=$([DateTime]::UtcNow.ToString('o'))" | Add-Content $path -Encoding utf8
              } catch {
                "attachException=$($_.Exception.ToString())" | Add-Content $path -Encoding utf8
              }
            }
            Start-Sleep -Milliseconds 100
          }
          '@ | Set-Content "$env:GITHUB_WORKSPACE\historical-toolchain-monitor.ps1" -Encoding utf8

      - name: Run controlled historical-toolchain experiment
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $probe = Join-Path $scripts 'issue_183_historical_topology_probe.py'
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $stack = "$env:GITHUB_WORKSPACE\tools\dotnet-stack.exe"
          $out = "$env:GITHUB_WORKSPACE\issue-183-historical-toolchain-v9b"
          $perturbOut = Join-Path $out 'historical-5s-dotnet-stack'
          $stop = "$env:GITHUB_WORKSPACE\issue-183-v9b-stop"
          $monitor = "$env:GITHUB_WORKSPACE\historical-toolchain-monitor.ps1"
          $monitorProcess = Start-Process pwsh -WindowStyle Hidden -PassThru -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',$monitor,'-StackTool',$stack,'-StopFile',$stop,'-OutDir',$perturbOut)
          $probeExit = 99
          try {
            Push-Location $scripts
            try {
              python $probe --repo "$env:GITHUB_WORKSPACE\target" --dump-tool $dump --out $out --passes $env:PASSES --max-minutes $env:MAX_MINUTES
              $probeExit = $LASTEXITCODE
            } finally { Pop-Location }
          } finally {
            New-Item -ItemType File -Force $stop | Out-Null
            try { Wait-Process -Id $monitorProcess.Id -Timeout 10 -ErrorAction Stop } catch { Stop-Process -Id $monitorProcess.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($probeExit -ne 0) { throw "Historical toolchain probe failed closed with exit code $probeExit" }

      - name: Publish result summary
        if: always()
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\issue-183-historical-toolchain-v9b"
          $summaryPath = Join-Path $root 'summary.json'
          $stackReports = @(Get-ChildItem $root -Recurse -File -Filter 'dotnet-stack-pid-*.txt' -ErrorAction SilentlyContinue).Count
          if (Test-Path $summaryPath) {
            $s = Get-Content $summaryPath -Raw | ConvertFrom-Json
            @('# Issue #183 — Historical Toolchain V9B','',"- Executions: $($s.totalExecutions)","- Historical 5-second dotnet-stack attaches: $stackReports","- Exact watchdogs: $($s.watchdogExecutions)","- Confirmed same-PID Full dumps: $($s.confirmedCaptures)","- Ordinary completed test failures: $($s.ordinaryTestFailures)","- Unexpected failures: $($s.unexpectedFailures)","- Passes completed: $($s.passesCompleted) / $($s.passesRequested)") | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload historical-toolchain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-historical-toolchain-v9b
          path: issue-183-historical-toolchain-v9b
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Publish completion reference
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 historical .NET toolchain V9B finished: $runUrl`n`nInspect exact-watchdog evidence first. If a same-PID dump exists, stop stress repetition and analyze the surviving shutdown owner immediately."
