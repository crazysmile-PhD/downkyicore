name: Validate Issue Quality

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate issue content
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const labels = issue.labels || [];
            const lowerLabels = labels.map(label =>
              label.name.toLowerCase()
            );

            if (issue.pull_request) {
              core.info("This is a pull request. Skip validation.");
              return;
            }

            /*
             * IMPORTANT:
             *
             * Do NOT classify bug type from "[Bug]" in the title.
             *
             * Both user-facing bugs and engineering/internal bugs may
             * legitimately use the same [Bug] prefix.
             *
             * Classification comes from:
             *   1. explicit subtype label, or
             *   2. unique Issue Form section headings.
             */

            const isEngineeringBug =
              lowerLabels.includes("engineering-bug") ||
              body.includes("### 🧭 問題來源") ||
              body.includes("### 🧱 受影響元件") ||
              body.includes("### 🧪 驗證 / 證據");

            const isUserBug =
              !isEngineeringBug &&
              (
                lowerLabels.includes("user-bug") ||
                body.includes("### 🚨 問題類型")
              );

            if (!isEngineeringBug && !isUserBug) {
              core.info(
                "Issue is neither a User Bug nor an Engineering Bug. " +
                "Skip bug validation."
              );
              return;
            }

            function escapeRegex(text) {
              return text.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
              );
            }

            function getSection(label) {
              const regex = new RegExp(
                `### ${escapeRegex(label)}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`,
                "i"
              );

              const match = body.match(regex);
              return match ? match[1].trim() : "";
            }

            function isFilled(text) {
              return (text || "").trim().length > 0;
            }

            async function ensureLabel(
              name,
              color,
              description
            ) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description
                  });
                } else {
                  throw error;
                }
              }
            }

            async function addLabelIfMissing(name) {
              if (lowerLabels.includes(name.toLowerCase())) {
                return;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [name]
              });
            }

            const userBugSections = [
              "🚨 問題類型",
              "📦 downkyiCore 版本",
              "📥 取得方式",
              "💻 作業系統",
              "🧩 作業系統詳細版本",
              "🖥️ 系統架構",
              "🔑 B 站登入狀態",
              "👑 大會員狀態",
              "🌐 網路環境",
              "🔍 解析模式",
              "⬇️ 下載器",
              "🎬 BV 號 / AV 號 / 影片連結",
              "🚨 問題摘要",
              "🔁 重現步驟",
              "✅ 預期行為",
              "❌ 實際行為",
              "🧨 錯誤訊息",
              "📄 日誌內容",
              "🛠️ 已嘗試的解決方式",
              "📊 發生頻率",
              "🔄 是否為舊版本正常、新版本異常？"
            ];

            const engineeringBugSections = [
              "🧭 問題來源",
              "📦 受影響版本 / Commit",
              "🧱 受影響元件",
              "🚨 問題摘要",
              "🔁 重現步驟",
              "✅ 預期行為",
              "❌ 實際行為",
              "🧪 驗證 / 證據",
              "🔬 Root cause / 初步分析",
              "🎯 影響 / 風險",
              "📊 發生頻率",
              "🔄 Regression 狀態",
              "🛠️ 已完成的排查",
              "🎯 建議 Acceptance Criteria",
              "📌 補充資訊"
            ];

            const issueKind =
              isEngineeringBug
                ? "Engineering Bug"
                : "User Bug";

            const requiredSections =
              isEngineeringBug
                ? engineeringBugSections
                : userBugSections;

            /*
             * Ensure classification labels exist.
             */
            await ensureLabel(
              "user-bug",
              "1d76db",
              "User-facing bug report requiring runtime diagnostics"
            );

            await ensureLabel(
              "engineering-bug",
              "7057ff",
              "Engineering, architecture, CI, persistence, or test finding"
            );

            await ensureLabel(
              "missing-info",
              "d73a4a",
              "Issue is missing required diagnostic information"
            );

            if (isEngineeringBug) {
              await addLabelIfMissing("engineering-bug");
            } else {
              await addLabelIfMissing("user-bug");
            }

            /*
             * Validate only fields belonging to the selected subtype.
             */
            const problems = [];

            for (const section of requiredSections) {
              const text = getSection(section);

              if (!isFilled(text)) {
                problems.push(
                  `${section}：未填寫`
                );
              }
            }

            const marker =
              "<!-- issue-quality-validator -->";

            const hadMissingInfo =
              lowerLabels.includes("missing-info");

            /*
             * PASS
             */
            if (problems.length === 0) {
              core.info(
                `${issueKind} passed validation.`
              );

              if (hadMissingInfo) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: "missing-info"
                }).catch(() => {});
              }

              /*
               * If this issue was automatically closed because information
               * was missing, editing it into a valid report automatically
               * reopens it.
               */
              if (
                issue.state === "closed" &&
                hadMissingInfo
              ) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "open"
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: [
                    marker,
                    `${issueKind} 必要欄位已補齊，Issue 已自動重新開啟。`
                  ].join("\n")
                });
              }

              return;
            }

            /*
             * FAIL
             */
            if (!hadMissingInfo) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ["missing-info"]
              });
            }

            const commentBody = [
              marker,
              `此 ${issueKind} 回報仍有必要欄位未填寫。`,
              "",
              "請補齊以下欄位：",
              "",
              ...problems.map(
                problem => `- ${problem}`
              ),
              "",
              "規則：",
              "",
              "- 只檢查該 Issue 類型真正需要的欄位",
              "- User Bug 與 Engineering Bug 使用不同驗證規則",
              "- 不檢查字數",
              "- 不要求已知 root cause",
              "- 不禁止填寫「無 / 不適用 / 未知」",
              "",
              "補齊後系統會再次檢查；若所有必要欄位都有內容，" +
                "missing-info 會被移除，必要時 Issue 會自動重新開啟。"
            ].join("\n");

            const comments =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              });

            const existingComment =
              comments.data.find(comment =>
                comment.user &&
                comment.user.type === "Bot" &&
                comment.body &&
                comment.body.includes(marker)
              );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody
              });
            }

            /*
             * Only auto-close on initial creation or an explicit reopen.
             *
             * Editing an already-closed issue that remains incomplete does
             * not repeatedly close it.
             */
            const shouldCloseIssue =
              context.payload.action === "opened" ||
              context.payload.action === "reopened";

            if (shouldCloseIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "not_planned"
              });
            } else {
              core.info(
                `${issueKind} still has missing fields after edit; ` +
                "do not close it again."
              );
            }
