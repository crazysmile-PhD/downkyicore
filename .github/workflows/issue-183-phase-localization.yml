name: Issue 183 xUnit Phase Localization V6

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Sampling duration per phase/assembly job'
        required: false
        default: '60'
        type: string
      max_iterations:
        description: 'Maximum phase executions per job'
        required: false
        default: '10000'
        type: string
  push:
    branches:
      - experiment/issue-183-capture-v2
    paths:
      - '.github/issue-183-phase-localization-trigger'

concurrency:
  group: issue-183-phase-localization-v6
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate phase observer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Publish run reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 xUnit phase-localization run started: $runUrl`n`nThis preserves the proven external exact watchdog -> same-PID Full-dump observer and changes only the phase under test: assembly-info or discovery, with no test execution."

      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dotnet-dump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Validate observer syntax and exact dump chain
        shell: pwsh
        run: |
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $probe = Join-Path $scripts 'issue_183_phase_watchdog_probe.py'
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          Push-Location $scripts
          try {
            python -m py_compile issue_183_exact_watchdog_capture.py issue_183_phase_watchdog_probe.py
            if ($LASTEXITCODE -ne 0) { throw 'Phase observer syntax validation failed.' }
            python $probe --self-test --dump-tool $dump --out "$env:GITHUB_WORKSPACE\issue-183-phase-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Exact watchdog -> Full dump preflight failed.' }
          } finally { Pop-Location }

      - name: Verify historical subject
        shell: pwsh
        run: |
          $sha = (& git -C "$env:GITHUB_WORKSPACE\target" rev-parse HEAD).Trim()
          if ($sha -ne '0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8') { throw "Historical SHA mismatch: $sha" }
          foreach ($name in @('DownKyi.Core.Tests','DownKyi.Desktop.Tests')) {
            $dll = "$env:GITHUB_WORKSPACE\target\tests\$name\bin\Release\net10.0\$name.dll"
            if (-not (Test-Path $dll -PathType Leaf)) { throw "Historical assembly missing: $dll" }
          }

  probe:
    name: ${{ matrix.assembly }} / ${{ matrix.phase }}
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        assembly: [core, desktop]
        phase: [assembly-info, discovery]
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes || '60' }}
      MAX_ITERATIONS: ${{ inputs.max_iterations || '10000' }}
    steps:
      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dotnet-dump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Sample xUnit phase with exact observer
        shell: pwsh
        run: |
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $probe = Join-Path $scripts 'issue_183_phase_watchdog_probe.py'
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $out = "$env:GITHUB_WORKSPACE\issue-183-phase-${{ matrix.assembly }}-${{ matrix.phase }}"
          Push-Location $scripts
          try {
            python $probe `
              --repo "$env:GITHUB_WORKSPACE\target" `
              --dump-tool $dump `
              --out $out `
              --assembly '${{ matrix.assembly }}' `
              --phase '${{ matrix.phase }}' `
              --duration-minutes $env:DURATION_MINUTES `
              --max-iterations $env:MAX_ITERATIONS
            if ($LASTEXITCODE -ne 0) { throw "Phase probe failed closed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Upload phase evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-phase-${{ matrix.assembly }}-${{ matrix.phase }}
          path: issue-183-phase-${{ matrix.assembly }}-${{ matrix.phase }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

  aggregate:
    name: Aggregate xUnit phase-localization report
    needs: probe
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download phase artifacts without flattening
        uses: actions/download-artifact@v7
        with:
          pattern: issue-183-phase-*
          path: collected
          merge-multiple: false

      - name: Build report
        shell: pwsh
        run: |
          $summaries = @(Get-ChildItem collected -Recurse -File -Filter summary.json -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json })
          $report = @('# Issue #183 — xUnit phase localization V6','', '- Historical SHA: `0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8`', '- Exact observer: unchanged external stdout/stderr watcher -> same-PID Full dump.', '- Test execution: **not run** in this experiment.', '')
          $watchdogs = 0; $captures = 0
          foreach ($s in $summaries | Sort-Object assembly, phase) {
            $watchdogs += [int]$s.watchdogExecutions
            $captures += [int]$s.confirmedCaptures
            $report += "- $($s.assembly) / $($s.phase): $($s.iterations) executions; watchdogs=$($s.watchdogExecutions); dumps=$($s.confirmedCaptures); unexpected=$($s.unexpectedFailures)"
          }
          $report += ''
          $report += "- Total exact watchdogs: $watchdogs"
          $report += "- **Confirmed same-PID dumps: $captures**"
          if ($captures -gt 0) {
            $report += '**Result:** no-test xUnit phase reproduced #183. Stop repetition and analyze the dump immediately.'
          } elseif ($watchdogs -gt 0) {
            $report += '**Result:** watchdog reproduced without a valid dump. Instrumentation failure; stop before more sampling.'
          } else {
            $report += '**Result:** assembly-info and discovery remained clean in this sample. Test execution or accumulated same-VM host state remains necessary candidate input.'
          }
          $report | Set-Content issue-183-phase-localization-report.md -Encoding utf8
          $report | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }

      - name: Publish completion reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 xUnit phase-localization run finished: $runUrl`n`nInspect the phase report and any retained exact-watchdog dump before changing the next variable."

      - name: Upload aggregate report
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-phase-localization-report-v6
          path: issue-183-phase-localization-report.md
          retention-days: 30
