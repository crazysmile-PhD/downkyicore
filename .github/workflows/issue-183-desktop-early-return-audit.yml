name: Issue 183 Desktop Early Return Ownership Audit

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - investigation/issue-183-assembly-info-owner
    paths:
      - '.github/workflows/issue-183-desktop-early-return-audit.yml'

env:
  TARGET_SHA: 75bff22801972ada7cfd24be595b0753780a7592

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout exact pre-fix target
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build exact Desktop test executable
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse HEAD).Trim()
          if ($sha -ne $env:TARGET_SHA) { throw "Target SHA mismatch: $sha" }
          dotnet restore tests/DownKyi.Desktop.Tests/DownKyi.Desktop.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build tests/DownKyi.Desktop.Tests/DownKyi.Desktop.Tests.csproj -c Release --no-restore --no-incremental
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Install ILSpy command line
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install ilspycmd --tool-path "$env:GITHUB_WORKSPACE\tools"
          if ($LASTEXITCODE -ne 0) { throw 'ilspycmd install failed.' }
          & "$env:GITHUB_WORKSPACE\tools\ilspycmd.exe" --version

      - name: Build assembly-load observation startup hook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hookRoot = "$env:GITHUB_WORKSPACE\loadhook"
          New-Item -ItemType Directory -Force $hookRoot | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content (Join-Path $hookRoot 'LoadHook.csproj') -Encoding utf8
          @'
          using System.Reflection;
          using System.Text.Json;

          public static class StartupHook
          {
              static readonly object Gate = new();
              static string? Path;

              public static void Initialize()
              {
                  Path = Environment.GetEnvironmentVariable("ISSUE183_LOAD_LOG");
                  if (string.IsNullOrWhiteSpace(Path))
                      return;

                  AppDomain.CurrentDomain.AssemblyLoad += (_, e) => Log(e.LoadedAssembly, "load");
                  foreach (var assembly in AppDomain.CurrentDomain.GetAssemblies())
                      Log(assembly, "initial");
              }

              static void Log(Assembly assembly, string kind)
              {
                  try
                  {
                      var row = JsonSerializer.Serialize(new
                      {
                          kind,
                          name = assembly.GetName().Name,
                          fullName = assembly.FullName,
                          location = SafeLocation(assembly),
                          utc = DateTimeOffset.UtcNow
                      });
                      lock (Gate)
                          File.AppendAllText(Path!, row + Environment.NewLine);
                  }
                  catch { }
              }

              static string? SafeLocation(Assembly assembly)
              {
                  try { return assembly.IsDynamic ? null : assembly.Location; }
                  catch { return null; }
              }
          }
          '@ | Set-Content (Join-Path $hookRoot 'StartupHook.cs') -Encoding utf8
          dotnet build (Join-Path $hookRoot 'LoadHook.csproj') -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Startup hook build failed.' }

      - name: Observe exact assembly-info loaded assembly set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE\issue-183-desktop-early-return-audit"
          New-Item -ItemType Directory -Force $out | Out-Null
          $bin = "$env:GITHUB_WORKSPACE\target\tests\DownKyi.Desktop.Tests\bin\Release\net10.0"
          $hook = "$env:GITHUB_WORKSPACE\loadhook\bin\Release\net10.0\LoadHook.dll"
          $log = Join-Path $out 'loaded-assemblies.jsonl'
          $env:DOTNET_STARTUP_HOOKS = $hook
          $env:ISSUE183_LOAD_LOG = $log
          Push-Location $bin
          try {
            & dotnet '.\DownKyi.Desktop.Tests.dll' '-assemblyInfo' 1> (Join-Path $out 'assembly-info.stdout.txt') 2> (Join-Path $out 'assembly-info.stderr.txt')
            $exit = $LASTEXITCODE
          } finally {
            Pop-Location
            Remove-Item Env:DOTNET_STARTUP_HOOKS -ErrorAction SilentlyContinue
            Remove-Item Env:ISSUE183_LOAD_LOG -ErrorAction SilentlyContinue
          }
          if ($exit -ne 0) { throw "assembly-info exited $exit" }
          if (-not (Test-Path $log)) { throw 'Assembly load log missing.' }

      - name: Audit loaded non-runtime assemblies and target entry path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE\issue-183-desktop-early-return-audit"
          $bin = "$env:GITHUB_WORKSPACE\target\tests\DownKyi.Desktop.Tests\bin\Release\net10.0"
          $ilspy = "$env:GITHUB_WORKSPACE\tools\ilspycmd.exe"
          $rows = Get-Content (Join-Path $out 'loaded-assemblies.jsonl') | ForEach-Object { $_ | ConvertFrom-Json }
          $loaded = @($rows | Where-Object { $_.location } | Group-Object location | ForEach-Object { $_.Group[0] })
          $runtimeRoot = [System.IO.Path]::GetFullPath($env:ProgramFiles + '\dotnet\shared')
          $candidates = @($loaded | Where-Object {
              $p = [System.IO.Path]::GetFullPath([string]$_.location)
              -not $p.StartsWith($runtimeRoot, [System.StringComparison]::OrdinalIgnoreCase) -and
              -not $p.EndsWith('LoadHook.dll', [System.StringComparison]::OrdinalIgnoreCase)
          })

          $patterns = @(
            'System.Threading.Thread::.ctor',
            'System.AppDomain::add_ProcessExit',
            'System.Runtime.Loader.AssemblyLoadContext::add_Unloading',
            'System.Console::add_CancelKeyPress',
            'System.AppDomain::add_UnhandledException',
            'System.Threading.Thread::set_IsBackground',
            'ModuleInitializerAttribute',
            'pinvokeimpl'
          )
          $hits = [System.Collections.Generic.List[object]]::new()
          foreach ($candidate in $candidates) {
            $path = [string]$candidate.location
            if (-not (Test-Path -LiteralPath $path)) { continue }
            $safe = ([IO.Path]::GetFileNameWithoutExtension($path) -replace '[^A-Za-z0-9_.-]', '_')
            $ilPath = Join-Path $out ($safe + '.il.txt')
            & $ilspy -il $path 2>&1 | Set-Content -LiteralPath $ilPath -Encoding utf8
            if ($LASTEXITCODE -ne 0) { continue }
            $lines = [IO.File]::ReadAllLines($ilPath)
            for ($i = 0; $i -lt $lines.Length; $i++) {
              foreach ($pattern in $patterns) {
                if ($lines[$i].Contains($pattern, [StringComparison]::OrdinalIgnoreCase)) {
                  $start = [Math]::Max(0, $i - 15)
                  $hits.Add([pscustomobject]@{
                    assembly = [IO.Path]::GetFileName($path)
                    path = $path
                    pattern = $pattern
                    line = $i + 1
                    context = ($lines[$start..$i] -join "`n")
                  })
                }
              }
            }
          }

          # Always decompile the target assembly separately to retain generated Main and assembly custom attributes.
          $targetDll = Join-Path $bin 'DownKyi.Desktop.Tests.dll'
          & $ilspy -il $targetDll 2>&1 | Set-Content (Join-Path $out 'DownKyi.Desktop.Tests.full.il.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Target IL decompile failed.' }

          $candidates | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'loaded-nonruntime-assemblies.json') -Encoding utf8
          $hits | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'lifecycle-hits.json') -Encoding utf8

          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('# Issue #183 Desktop assembly-info early-return ownership audit')
          $report.Add('')
          $report.Add("- Exact target: ``$env:TARGET_SHA``")
          $report.Add("- Runtime-observed loaded assemblies: $($loaded.Count)")
          $report.Add("- Loaded non-runtime assemblies audited: $($candidates.Count)")
          $report.Add("- Direct lifecycle/module/native hits: $($hits.Count)")
          $report.Add('')
          $report.Add('## Loaded non-runtime assemblies')
          foreach ($candidate in $candidates) { $report.Add("- ``$($candidate.name)`` — ``$($candidate.location)``") }
          $report.Add('')
          $report.Add('## Hits')
          if ($hits.Count -eq 0) { $report.Add('- None.') }
          foreach ($hit in $hits) {
            $report.Add("### $($hit.assembly) — $($hit.pattern) — IL line $($hit.line)")
            $report.Add('```text')
            $report.Add($hit.context)
            $report.Add('```')
          }
          $report | Set-Content (Join-Path $out 'audit-report.md') -Encoding utf8
          Get-Content (Join-Path $out 'audit-report.md') | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload early-return ownership audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-desktop-early-return-audit
          path: issue-183-desktop-early-return-audit
          retention-days: 30
          compression-level: 1

      - name: Publish run reference
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 fixed-scope Desktop assembly-info early-return ownership audit: $url`n`nExact target 75bff228; runtime-observed loaded assembly set plus compiled IL lifecycle/module/native-owner audit. Inspect audit-report.md before any further dynamic experiment."
