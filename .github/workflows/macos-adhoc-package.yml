name: macOS ad-hoc package validation

on:
  pull_request:
    paths:
      - '.github/workflows/macos-adhoc-package.yml'
      - '.github/actions/build-macos-app/action.yml'
      - 'DownKyi/**/*.csproj'
      - 'DownKyi.Core/**/*.csproj'
      - 'src/**/*.csproj'
      - 'src/DownKyi.Desktop/Resources/favicon.ico'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '.python-version'
      - 'global.json'
      - 'version.txt'
      - 'THIRD-PARTY-NOTICES.md'
      - 'script/validate-publish-output.ps1'
      - 'script/macos/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  package-validation:
    name: Validate package (${{ matrix.runtime }}, ad-hoc)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            runtime: osx-x64
            os: macos-15-intel
          - cpu: arm64
            runtime: osx-arm64
            os: macos-26
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Record runner identity
        run: |
          sw_vers
          uname -m
      - name: Install packaging tools
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=true
          brew untap aws/tap || true
          brew install create-dmg tree
      - name: Install .NET
        uses: $/.github/actions/setup-dotnet
        with:
          global-json-file: global.json
      - name: Install Python for FFmpeg source build
        uses: $/.github/actions/setup-python
        with:
          python-version-file: .python-version
      - name: Build and validate macOS app bundle
        id: macos-app
        uses: ./.github/actions/build-macos-app
        with:
          cpu: ${{ matrix.cpu }}
          manifest-path: script/macos/publish-manifest-osx-${{ matrix.cpu }}.json
      - name: Ad-hoc sign app
        working-directory: ./script/macos
        env:
          MACOS_ADHOC_SIGNING: 'true'
        run: |
          chmod +x codesign-common.sh prepare-app-layout.sh sign.sh verify-app-signature.sh verify-app-loader.sh validate-dmg-package.sh verify-runtime-architecture.sh
          ./sign.sh
      - name: Verify ad-hoc signing policy
        working-directory: ./script/macos
        run: |
          details="$(codesign -dvvv '哔哩下载姬.app' 2>&1)"
          printf '%s\n' "$details"
          if printf '%s\n' "$details" | grep -Eq 'flags=.*runtime'; then
            echo '::error::Ad-hoc app unexpectedly enables Hardened Runtime.'
            exit 1
          fi
          ./verify-app-signature.sh
      - name: Create DMG
        working-directory: ./script/macos
        run: |
          chmod +x create-dmg.sh
          ./create-dmg.sh ${{ steps.macos-app.outputs.version }} ${{ matrix.cpu }}
      - name: Validate mounted and installed package contracts
        working-directory: ./script/macos
        env:
          MACOS_VERIFY_GATEKEEPER: 'false'
        run: ./validate-dmg-package.sh DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg ${{ steps.macos-app.outputs.version }} osx-${{ matrix.cpu }}
      - name: Hash DMG
        shell: pwsh
        run: |
          $package = "script/macos/DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg"
          ./script/write-package-checksum.ps1 -PackagePath $package
      - name: Upload verified DMG
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/.github/actions/upload-artifact
        with:
          name: DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}-adhoc-${{ matrix.os }}
          path: |
            script/macos/DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg
            script/macos/DownKyi-${{ steps.macos-app.outputs.version }}-osx-${{ matrix.cpu }}.dmg.sha256
            script/macos/publish-manifest-osx-${{ matrix.cpu }}.json
