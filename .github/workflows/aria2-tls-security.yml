name: aria2 TLS security

on:
  pull_request:
    paths:
      - '.github/workflows/aria2-tls-security.yml'
      - 'script/aria2.ps1'
      - 'script/aria2.sh'
      - 'script/download-external-asset.ps1'
      - 'script/assets/external-assets.json'
      - 'DownKyi.Core/DownKyi.Core.csproj'
      - 'DownKyi.Core/Aria2cNet/**'
      - 'DownKyi.Core/Settings/**'
      - 'src/DownKyi.Desktop/DownKyi.Desktop.csproj'
      - 'src/DownKyi.Desktop/Services/Download/**'
      - 'tests/DownKyi.Tests/Aria2Tls*.cs'
      - 'tests/DownKyi.Tests/DownKyi.Tests.csproj'
      - 'tests/TestInfrastructure/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aria2-tls-security.yml'
      - 'script/aria2.ps1'
      - 'script/aria2.sh'
      - 'script/download-external-asset.ps1'
      - 'script/assets/external-assets.json'
      - 'DownKyi.Core/DownKyi.Core.csproj'
      - 'DownKyi.Core/Aria2cNet/**'
      - 'DownKyi.Core/Settings/**'
      - 'src/DownKyi.Desktop/DownKyi.Desktop.csproj'
      - 'src/DownKyi.Desktop/Services/Download/**'
      - 'tests/DownKyi.Tests/Aria2Tls*.cs'
      - 'tests/DownKyi.Tests/DownKyi.Tests.csproj'
      - 'tests/TestInfrastructure/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SOLUTION_FILE: ./DownKyi.sln

jobs:
  verify:
    name: aria2 TLS security (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            runner: windows-latest
            asset-argument: x86
            binary: DownKyi.Core/Binary/win-x86/aria2/aria2c.exe
          - rid: win-x64
            runner: windows-latest
            asset-argument: x64
            binary: DownKyi.Core/Binary/win-x64/aria2/aria2c.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            asset-argument: linux-x64
            binary: DownKyi.Core/Binary/linux-x64/aria2/aria2c
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            asset-argument: linux-arm64
            binary: DownKyi.Core/Binary/linux-arm64/aria2/aria2c
          - rid: osx-x64
            runner: macos-15-intel
            asset-argument: osx-x64
            binary: DownKyi.Core/Binary/osx-x64/aria2/aria2c
          - rid: osx-arm64
            runner: macos-15
            asset-argument: osx-arm64
            binary: DownKyi.Core/Binary/osx-arm64/aria2/aria2c
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Fetch and verify Windows aria2 asset
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./script/aria2.ps1 '${{ matrix.asset-argument }}'
      - name: Fetch and verify Unix aria2 asset
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: bash ./script/aria2.sh '${{ matrix.asset-argument }}'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Install ARM64 protobuf compiler
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Build TLS integration tests with all warnings as errors
        env:
          PROTOBUF_PROTOC: ${{ matrix.rid == 'linux-arm64' && '/usr/bin/protoc' || '' }}
        run: >
          dotnet build ./tests/DownKyi.Tests/DownKyi.Tests.csproj
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false
      - name: Verify packaged aria2 TLS behavior
        shell: pwsh
        env:
          DOWNKYI_ARIA2_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
          DOWNKYI_ARIA2_RID: ${{ matrix.rid }}
          DOWNKYI_ARIA2_TLS_REPORT: ${{ github.workspace }}/artifacts/aria2-tls/${{ matrix.rid }}
        run: |
          . ./script/test-project-runner.ps1
          $result = Invoke-DownKyiTestProject `
            -RepositoryRoot (Get-Location).Path `
            -ProjectPath ./tests/DownKyi.Tests/DownKyi.Tests.csproj `
            -Configuration Release `
            -NoRestore `
            -NoBuild `
            -ResultsDirectory ./artifacts/test-results/aria2-${{ matrix.rid }} `
            -ClassNames DownKyi.Tests.Aria2TlsIntegrationTests
          if ($result.ExitCode -ne 0) {
            throw "Packaged aria2 TLS integration tests failed."
          }
      - name: Upload sanitized aria2 TLS report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: aria2-tls-${{ matrix.rid }}
          path: |
            artifacts/aria2-tls/${{ matrix.rid }}
            artifacts/test-results/aria2-${{ matrix.rid }}
            artifacts/test-flight-recorder
          if-no-files-found: warn
