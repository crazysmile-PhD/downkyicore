name: Issue 183 Historical Same-VM Topology V7

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      passes:
        description: 'Number of complete historical seven-assembly passes'
        required: false
        default: '3'
        type: string
      max_minutes:
        description: 'Maximum sampling time on the single Hosted Windows VM'
        required: false
        default: '120'
        type: string
  push:
    branches:
      - experiment/issue-183-capture-v2
    paths:
      - '.github/issue-183-historical-topology-trigger'

concurrency:
  group: issue-183-historical-topology-v7
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate exact observer and historical topology subject
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Publish run reference
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 historical same-VM topology V7 started: $runUrl`n`nThis changes only the host topology: the original seven assemblies run sequentially on one Hosted Windows VM in the historical order, while the proven external exact-watchdog -> same-PID Full-dump observer remains unchanged."

      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dotnet-dump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Validate exact observer and topology probe
        shell: pwsh
        run: |
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          Push-Location $scripts
          try {
            python -m py_compile issue_183_exact_watchdog_capture.py issue_183_historical_topology_probe.py
            if ($LASTEXITCODE -ne 0) { throw 'Topology probe syntax validation failed.' }
            python issue_183_exact_watchdog_capture.py --self-test --dump-tool $dump --out "$env:GITHUB_WORKSPACE\issue-183-topology-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Exact watchdog -> Full dump preflight failed.' }
          } finally { Pop-Location }

      - name: Verify historical subject and order
        shell: pwsh
        run: |
          $sha = (& git -C "$env:GITHUB_WORKSPACE\target" rev-parse HEAD).Trim()
          if ($sha -ne '0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8') { throw "Historical SHA mismatch: $sha" }
          $assemblies = @(
            'DownKyi.Application.Tests',
            'DownKyi.Architecture.Tests',
            'DownKyi.Core.Tests',
            'DownKyi.Desktop.Tests',
            'DownKyi.Domain.Tests',
            'DownKyi.Infrastructure.Tests',
            'DownKyi.Tests'
          )
          foreach ($name in $assemblies) {
            $dll = "$env:GITHUB_WORKSPACE\target\tests\$name\bin\Release\net10.0\$name.dll"
            if (-not (Test-Path $dll -PathType Leaf)) { throw "Historical assembly missing: $dll" }
          }

  topology:
    name: Historical seven-assembly same-VM sequence
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PASSES: ${{ inputs.passes || '3' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '120' }}
    steps:
      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: instrumentation

      - name: Checkout historical failure SHA
        uses: actions/checkout@v7
        with:
          ref: 0ef53f0b3570dd5b5fe8f6fe6eda52e5f9badeb8
          fetch-depth: 0
          path: target

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dotnet-dump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          dotnet tool install dotnet-dump --tool-path "$env:GITHUB_WORKSPACE\tools" --version 9.0.661903

      - name: Restore historical checkout
        working-directory: target
        run: dotnet restore ./DownKyi.sln

      - name: Strict Release build
        working-directory: target
        run: >
          dotnet build ./DownKyi.sln
          -c Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:EnableNETAnalyzers=true
          -p:AnalysisMode=All
          -p:EnforceCodeStyleInBuild=true
          -p:UseSharedCompilation=false

      - name: Run historical same-VM topology with exact observer
        shell: pwsh
        run: |
          $scripts = "$env:GITHUB_WORKSPACE\instrumentation\script\research"
          $probe = Join-Path $scripts 'issue_183_historical_topology_probe.py'
          $dump = "$env:GITHUB_WORKSPACE\tools\dotnet-dump.exe"
          $out = "$env:GITHUB_WORKSPACE\issue-183-historical-topology-v7"
          Push-Location $scripts
          try {
            python $probe `
              --repo "$env:GITHUB_WORKSPACE\target" `
              --dump-tool $dump `
              --out $out `
              --passes $env:PASSES `
              --max-minutes $env:MAX_MINUTES
            if ($LASTEXITCODE -ne 0) { throw "Historical topology probe failed closed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Publish result summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = "$env:GITHUB_WORKSPACE\issue-183-historical-topology-v7\summary.json"
          if (Test-Path $summaryPath) {
            $s = Get-Content $summaryPath -Raw | ConvertFrom-Json
            @(
              '# Issue #183 — Historical Same-VM Topology V7',
              '',
              "- Executions: $($s.totalExecutions)",
              "- Exact watchdogs: $($s.watchdogExecutions)",
              "- Confirmed same-PID Full dumps: $($s.confirmedCaptures)",
              "- Unexpected failures: $($s.unexpectedFailures)",
              "- Passes completed: $($s.passesCompleted) / $($s.passesRequested)"
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload topology evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-183-historical-topology-v7
          path: issue-183-historical-topology-v7
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Publish completion reference
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 185 --repo $env:GITHUB_REPOSITORY --body "Issue #183 historical same-VM topology V7 finished: $runUrl`n`nInspect the retained exact-watchdog evidence first. If a same-PID dump exists, stop stress repetition and analyze the direct surviving thread/causal owner immediately."
