name: Run repository test project
description: Executes one platform-owned test project through the central runner and result validator.

inputs:
  repository-root:
    description: Repository root containing the central runner.
    required: false
    default: ''
  project-path:
    description: Test project path.
    required: true
  configuration:
    description: Build configuration.
    required: false
    default: Release
  no-restore:
    description: Skip restore in the central runner.
    required: false
    default: 'false'
  no-build:
    description: Skip build in the central runner.
    required: false
    default: 'false'
  results-directory:
    description: Optional TRX output directory.
    required: false
    default: ''
  trx-name:
    description: Optional TRX filename.
    required: false
    default: ''
  expected-class:
    description: Optional class that must have a passing result.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run central project test gate
      shell: pwsh
      env:
        DOWNKYI_TEST_REPOSITORY_ROOT: ${{ inputs.repository-root }}
        DOWNKYI_TEST_PROJECT_PATH: ${{ inputs.project-path }}
        DOWNKYI_TEST_CONFIGURATION: ${{ inputs.configuration }}
        DOWNKYI_TEST_NO_RESTORE: ${{ inputs.no-restore }}
        DOWNKYI_TEST_NO_BUILD: ${{ inputs.no-build }}
        DOWNKYI_TEST_RESULTS_DIRECTORY: ${{ inputs.results-directory }}
        DOWNKYI_TEST_TRX_NAME: ${{ inputs.trx-name }}
        DOWNKYI_TEST_EXPECTED_CLASS: ${{ inputs.expected-class }}
      run: >
        & (Join-Path '${{ github.action_path }}' '../../../script/invoke-ci-test-action.ps1')
        -Mode Project
