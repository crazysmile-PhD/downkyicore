name: Import Apple code-signing certificates
description: Repository-owned version outlet for apple-actions/import-codesign-certs.

inputs:
  p12-file-base64:
    description: Base64-encoded PKCS12 certificate bundle.
    required: true
  p12-password:
    description: Password for the PKCS12 certificate bundle.
    required: true

runs:
  using: composite
  steps:
    - name: Import Apple code-signing certificates
      uses: apple-actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ inputs.p12-file-base64 }}
        p12-password: ${{ inputs.p12-password }}
